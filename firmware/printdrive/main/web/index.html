<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121416" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DataDrive">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>WiFi DataDrive</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b7a75'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'%3E%3Cpath d='M9.5 13a9.2 9.2 0 0 1 13 0'/%3E%3Cpath d='M12.7 16.2a4.7 4.7 0 0 1 6.6 0'/%3E%3C/g%3E%3Crect x='8' y='19.5' width='16' height='6' rx='2' fill='%23fff'/%3E%3Ccircle cx='20.5' cy='22.5' r='1.1' fill='%230b7a75'/%3E%3C/svg%3E">
<style>
/* ---------- Design tokens ---------- */
:root{
  --bg:#f7f7f5;--surface:#fff;--text:#1b1d21;--muted:#666b74;--line:#e5e6e2;--hover:#efefec;
  --accent:#09706b;--on-accent:#fff;--accent-soft:#e2f1ef;
  --usb:#5252cc;--usb-soft:#ebebfa;
  --warn:#9a5a05;--warn-soft:#fcf0da;
  --danger:#bd3328;--danger-soft:#fbe8e6;--on-danger:#fff;
  --shadow:0 8px 30px rgba(20,24,28,.16);
  --r:10px;--r-lg:16px;
  --top:calc(60px + env(safe-area-inset-top));
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#121416;--surface:#1b1e21;--text:#e9eaec;--muted:#9da3ab;--line:#2b2f34;--hover:#24282c;
  --accent:#3dbfb6;--on-accent:#04211f;--accent-soft:#15302e;
  --usb:#a3a3f7;--usb-soft:#25254d;
  --warn:#efb45c;--warn-soft:#3a2c13;
  --danger:#f0766c;--danger-soft:#3e1d1a;--on-danger:#2b0c09;
  --shadow:0 8px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme=dark]{
  --bg:#121416;--surface:#1b1e21;--text:#e9eaec;--muted:#9da3ab;--line:#2b2f34;--hover:#24282c;
  --accent:#3dbfb6;--on-accent:#04211f;--accent-soft:#15302e;
  --usb:#a3a3f7;--usb-soft:#25254d;
  --warn:#efb45c;--warn-soft:#3a2c13;
  --danger:#f0766c;--danger-soft:#3e1d1a;--on-danger:#2b0c09;
  --shadow:0 8px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}

/* ---------- Base ---------- */
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3,p{margin:0}
h1{font-size:22px;font-weight:650;letter-spacing:-.01em}
h2{font-size:16px;font-weight:650}
h3{font-size:15px;font-weight:600}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:960px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.muted{color:var(--muted)}
.small{font-size:13px;color:var(--muted)}

/* ---------- Controls ---------- */
button,input,select{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:0;border-radius:var(--r);background:var(--hover);font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--text);transition:filter .12s}
.btn:hover{filter:brightness(.96)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.danger{background:var(--danger);color:var(--on-danger)}
.btn.outline-danger{background:none;color:var(--danger);box-shadow:inset 0 0 0 1.5px var(--danger)}
.btn:disabled{opacity:.55;cursor:default;filter:none}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border:0;border-radius:50%;background:none;cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.linkbtn{background:none;border:0;min-height:40px;padding:0 8px;color:var(--accent);font-weight:600;cursor:pointer;border-radius:8px}
.field{width:100%;min-height:44px;padding:0 12px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface)}
.field:focus{outline:0;border-color:var(--accent)}
label.lbl{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition:none!important}}

/* ---------- Header ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:6px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:16px;color:inherit;text-decoration:none;margin-right:auto;letter-spacing:-.01em;min-width:0;white-space:nowrap}
.brand svg{width:30px;height:30px;flex:none}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px;text-transform:uppercase;flex:none}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);margin:4px 0 12px;font-size:14px}
.notice.info{background:var(--accent-soft);color:var(--text)}
.notice.info svg,.notice.info .spin{color:var(--accent)}
.notice .spin{margin-top:3px}

/* ---------- Sign-in and forced password change ---------- */
.authv .top,.authv #app,.authv .fab{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.card{width:min(400px,100%);background:var(--surface);border-radius:var(--r-lg);padding:28px 24px 18px;display:grid;gap:14px}
.card .logo{width:48px;height:48px}
.card .notice{margin:0}
.card .btn{width:100%;margin-top:4px}
.card .linkbtn{justify-self:center}
.card .small{text-align:center}

/* ---------- Status strip ---------- */
.status{display:grid;grid-template-columns:1.25fr 1fr;background:var(--surface);border-radius:var(--r-lg);margin:4px 0 26px}
.cell{display:flex;align-items:center;gap:14px;padding:16px 18px;min-width:0}
.cell + .cell{border-left:1px solid var(--line)}
.cell .txt{min-width:0;flex:1}
.cell .title{font-weight:650;display:block}
.cell .sub{display:block;font-size:13px;color:var(--muted)}
.badge{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--hover);color:var(--muted)}
.mode-usb .badge{background:var(--usb-soft);color:var(--usb)}
.mode-app .badge{background:var(--accent-soft);color:var(--accent)}
.mode-err .badge{background:var(--danger-soft);color:var(--danger)}
.bar{display:block;height:6px;border-radius:3px;background:var(--hover);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .3s}
.bar.high>i{background:var(--warn)}
.bar.full>i{background:var(--danger)}

/* ---------- Breadcrumb, toolbar, selection and clipboard bars ---------- */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;margin:-6px 0 0 -6px;font-size:14px;color:var(--muted);min-width:0}
.cr{display:inline-flex;align-items:center;min-width:0;max-width:100%}
.cr+.cr::before{content:"›";padding:0 1px;flex:none}
.crumbs a,.crumbs .ell,.crumbs [aria-current]{color:inherit;text-decoration:none;font-weight:600;padding:9px 6px;border-radius:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.crumbs a:hover,.crumbs .ell:hover{color:var(--text);background:var(--hover)}
.crumbs [aria-current]{color:var(--text)}
.crumbs .ell{border:0;background:none;cursor:pointer;font:inherit;font-weight:700;min-width:32px}
.cr.ellc{display:none}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.toolbar h1{margin-right:auto;min-width:0;overflow-wrap:anywhere}
.count{font-size:13px;color:var(--muted);font-weight:400;margin-left:8px;letter-spacing:0}
.search{position:relative;flex:0 1 240px}
.search svg{position:absolute;left:12px;top:12px;color:var(--muted);pointer-events:none}
.search input{padding-left:40px;border-color:transparent;background:var(--surface)}
.sort-m{display:none}
.bars{position:sticky;top:var(--top);z-index:15;background:var(--bg)}
.selbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px;min-height:56px;padding:6px;margin-bottom:10px;border-radius:var(--r-lg);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--accent-soft)}
.selbar strong{margin-right:auto;padding:0 6px 0 2px}
.sacts{display:flex;gap:2px;flex-wrap:wrap}
.sb{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;min-width:40px;padding:0 12px;border:0;border-radius:var(--r);background:none;color:var(--text);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.sb:hover{background:var(--hover)}
.sb.danger{color:var(--danger)}
.sb:disabled{opacity:.4;cursor:default;background:none}
.clipbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:8px 8px 8px 14px;margin-bottom:10px;border-radius:var(--r-lg);background:var(--accent-soft)}
.clipbar>svg{color:var(--accent)}
.clipbar>span{flex:1 1 150px;min-width:0;font-weight:600;overflow-wrap:anywhere}
.clipbar .btn{min-height:40px;padding:0 14px}
.clipbar .btn:not(.primary){background:none}

/* ---------- Files ---------- */
.cols,.row{display:grid;grid-template-columns:40px minmax(0,1fr) 110px 150px 44px;gap:14px;align-items:center}
.cols{padding:8px 8px 8px 10px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.cols .lead{height:28px}
.cols button{background:none;border:0;padding:4px 0;cursor:pointer;color:inherit;font-weight:600;display:inline-flex;gap:4px;align-items:center;text-align:left}
.cols button svg{width:14px;height:14px}
.cols button.on{color:var(--text)}
.cols .num,.row .num{text-align:right;justify-content:flex-end}
.row{padding:8px 8px 8px 10px;border-radius:var(--r);cursor:pointer;min-height:60px}
.row.open{background:var(--surface)}
.row.sel,.row.sel:hover{background:var(--accent-soft)}
.row .name{display:flex;font-weight:550;min-width:0;color:inherit;text-decoration:none}
.name .nb{overflow:hidden;text-overflow:ellipsis;white-space:pre}
.name .ne{flex:none;white-space:pre}
.row .meta{display:none;font-size:13px;color:var(--muted)}
.row .num,.row .date{font-size:14px;color:var(--muted);white-space:nowrap}
.lead{position:relative;width:40px;height:40px}
.ck{position:absolute;inset:0;width:100%;height:100%;margin:0;-webkit-appearance:none;appearance:none;border-radius:10px;background:var(--hover);cursor:pointer;opacity:0;display:grid;place-items:center}
.row.sel .ck{background:transparent}
.ck::before,.ck::after{content:"";grid-area:1/1}
.ck::before{width:20px;height:20px;border-radius:6px;box-shadow:inset 0 0 0 2px var(--muted)}
.ck:checked::before,.ck:indeterminate::before{background:var(--accent);box-shadow:none}
.ck::after{width:5px;height:10px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg);opacity:0}
.ck:checked::after{opacity:1}
.ck:indeterminate::after{opacity:1;width:10px;height:0;border-width:0 0 2.5px;transform:none}
.selmode .ck,.ck:checked,.ck:focus-visible{opacity:1}
@media (hover:hover){.row:hover{background:var(--surface)}a.name:hover .nb{text-decoration:underline}.row:hover .ck,.cols:hover .ck{opacity:1}}
@media (hover:none){.ck{pointer-events:none}.selmode .ck{pointer-events:auto}.row{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}}
.ficon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:10px;font-weight:750;letter-spacing:.02em;background:var(--hover);color:var(--muted)}
.ficon.long{font-size:8.5px}
.ficon svg{width:18px;height:18px}
.ficon.dir{color:var(--accent);background:var(--accent-soft)}
.ficon.dir svg{width:21px;height:21px;fill:currentColor;fill-opacity:.2}
.ficon.model{color:var(--accent);background:var(--accent-soft)}
.ficon.image{color:#9c2a6e;background:color-mix(in srgb,#9c2a6e 13%,transparent)}
.ficon.doc{color:#2857ab;background:color-mix(in srgb,#2857ab 13%,transparent)}
.ficon.archive{color:var(--warn);background:var(--warn-soft)}
.ficon.media{color:var(--usb);background:var(--usb-soft)}
:root[data-theme=dark] .ficon.image{color:#f08cc4}:root[data-theme=dark] .ficon.doc{color:#8db4f5}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .ficon.image{color:#f08cc4}:root:not([data-theme=light]) .ficon.doc{color:#8db4f5}}
.state{text-align:center;padding:56px 16px 40px;color:var(--muted)}
.state .big{width:64px;height:64px;border-radius:20px;background:var(--surface);display:grid;place-items:center;margin:0 auto 18px;color:var(--muted)}
.state .big svg{width:28px;height:28px}
.state h2{color:var(--text);margin-bottom:6px;font-size:18px}
.state p{max-width:460px;margin:0 auto 20px}
.state .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted);padding:14px 10px 0}
.skel{height:60px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface),var(--hover),var(--surface));background-size:200% 100%;animation:sk 1.4s infinite;margin-bottom:6px}
@keyframes sk{to{background-position:-200% 0}}
.fab{display:none}
.list{padding-bottom:calc(var(--ph,0px) + 48px)}

/* ---------- Menu / sheet ---------- */
.scrim{position:fixed;inset:0;z-index:40}
.menu{position:fixed;z-index:41;min-width:220px;max-width:calc(100vw - 16px);background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:6px}
.menu .mhead{display:none}
.menu .mhead.uhead{display:block;padding:8px 12px 10px;margin-bottom:4px;border-bottom:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mhead small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.menu button{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 12px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--hover)}
.menu button.danger{color:var(--danger)}

/* ---------- Busy overlay (copying blocks the device) ---------- */
.busy{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:16px;background:rgba(10,12,14,.45)}
.busy>div{display:flex;gap:14px;align-items:flex-start;max-width:420px;padding:20px 22px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow)}
.busy .spin{width:22px;height:22px;color:var(--accent)}
.busy strong{display:block;overflow-wrap:anywhere}
.busy p{color:var(--muted);font-size:14px;margin-top:4px}

/* ---------- Uploads panel ---------- */
.uploads{position:fixed;right:20px;bottom:20px;z-index:30;width:380px;max-width:calc(100vw - 32px);background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.uploads header{display:flex;align-items:center;gap:8px;padding:10px 8px 6px 16px;min-height:56px}
.uploads header strong{margin-right:auto}
.uploads ul{list-style:none;margin:0;padding:0 16px 12px;max-height:38vh;overflow:auto}
.uploads li{padding:8px 0}
.uploads .l1{display:flex;gap:10px;align-items:center;min-height:32px}
.uploads .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550}
.uploads .s{font-size:13px;color:var(--muted);white-space:nowrap}
.uploads .ok{color:var(--accent)}
.uploads .err{color:var(--danger);white-space:normal}
.uploads .x{width:32px;height:32px}
.uploads .bar{margin-top:4px}

/* ---------- Toasts ---------- */
.toasts{position:fixed;left:24px;bottom:24px;z-index:80;display:flex;flex-direction:column;align-items:flex-start;gap:8px;pointer-events:none;max-width:min(440px,calc(100vw - 444px))}
.toast{max-width:520px;padding:12px 16px;border-radius:12px;background:var(--text);color:var(--bg);box-shadow:var(--shadow);font-size:14px;animation:tin .18s ease-out}
.toast.err{background:var(--danger);color:var(--on-danger)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* ---------- Drop overlay ---------- */
.drop{position:fixed;inset:12px;z-index:50;border:2.5px dashed var(--accent);border-radius:24px;background:var(--accent-soft);opacity:.96;display:grid;place-items:center;color:var(--accent);font-size:20px;font-weight:650;pointer-events:none;text-align:center;padding:24px}

/* ---------- Dialog ---------- */
dialog{border:0;border-radius:var(--r-lg);background:var(--surface);color:var(--text);padding:0;width:min(440px,calc(100vw - 32px));box-shadow:var(--shadow)}
dialog form{padding:24px}
dialog::backdrop{background:rgba(10,12,14,.5)}
dialog h2{font-size:18px;margin-bottom:8px;overflow-wrap:anywhere}
dialog p{color:var(--muted);margin-bottom:10px;overflow-wrap:anywhere}
dialog .derr{color:var(--danger);font-size:13px;margin-top:8px}
#dFields>*+*{margin-top:12px}
.chk{display:flex;gap:10px;align-items:center;min-height:40px;cursor:pointer;font-size:14px}
.chk input{width:20px;height:20px;margin:0;accent-color:var(--accent);flex:none}
.chk small{display:block;font-size:13px;color:var(--muted)}
.card .chk{align-items:flex-start;min-height:0}
.card .chk input{margin-top:1px}
.derr:empty,.formmsg:empty{display:none}
dialog .dacts{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}

/* ---------- Settings ---------- */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-weight:600;margin:6px 0 14px -4px;padding:8px 8px 8px 4px;border-radius:8px}
.back:hover{color:var(--text)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px -16px 6px;padding:2px 16px 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;padding:8px 14px;border-radius:99px;background:var(--surface);color:var(--text);text-decoration:none;font-weight:600;font-size:14px}
.sec{padding:26px 0 8px;scroll-margin-top:70px}
.sec>h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px}
.group{background:var(--surface);border-radius:var(--r-lg)}
.group>*+*{border-top:1px solid var(--line)}
.item{display:flex;gap:16px;align-items:center;padding:16px 18px}
.item .txt{flex:1 1 170px;min-width:0}
.item.col>.txt{flex:none}
.item .txt p{font-size:13px;color:var(--muted);margin-top:2px}
.item.col{flex-direction:column;align-items:stretch;gap:12px}
.item .inner{display:flex;gap:16px;align-items:center}
.item .notice{margin:0}
.item .acts{display:flex;gap:10px;flex-wrap:wrap}
.kv{display:flex;justify-content:space-between;gap:16px}
.kv span:last-child{color:var(--muted);text-align:right;overflow-wrap:anywhere}
.li{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 8px 8px 18px}
.li+.li{border-top:1px solid var(--line)}
.li .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.li .txt small{display:block;color:var(--muted);font-size:13px}
.li>svg{color:var(--muted)}
.pill{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:650}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:12px 18px}
.formmsg{font-size:13px}
.formmsg.ok{color:var(--accent)}.formmsg.err{color:var(--danger)}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{position:absolute;inset:-7px;opacity:0;margin:0;cursor:pointer;width:calc(100% + 14px);height:calc(100% + 14px)}
.switch i{position:absolute;inset:0;border-radius:15px;background:var(--line);transition:background .15s;pointer-events:none}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch input:checked + i{background:var(--accent)}
.switch input:checked + i::after{transform:translateX(20px)}
.switch input:focus-visible + i{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;background:var(--hover);border-radius:var(--r);padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
pre.log{margin:0;padding:14px;border-radius:var(--r);background:var(--bg);font:12px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow:auto;max-height:340px}
.dangerzone .group{box-shadow:inset 0 0 0 1.5px var(--danger-soft)}
.dangerzone>h2{color:var(--danger)}
.role-user .adm{display:none!important}
footer{padding:28px 0 calc(40px + env(safe-area-inset-bottom) + var(--ph,0px));font-size:13px;color:var(--muted)}

/* ---------- Phone ---------- */
@media (max-width:720px){
  h1{font-size:20px}
  .status{grid-template-columns:1fr}
  .cell + .cell{border-left:0;border-top:1px solid var(--line)}
  .cell.mode{flex-wrap:wrap}
  .cell.mode .btn{width:100%;margin-top:2px}
  .cr.mid{display:none}
  .cr.ellc{display:inline-flex}
  .crumbs a,.crumbs [aria-current]{max-width:150px}
  .search{flex:1 1 100%;order:3}
  .sort-m{display:block;order:2;flex:0 1 auto;width:auto;min-height:40px;padding:0 4px;border-color:transparent;background:transparent;color:var(--muted);font-size:14px;font-weight:600}
  .toolbar .mk{order:2;width:44px;padding:0;background:none;color:var(--muted)}
  .toolbar .mk .bl{display:none}
  .cols{display:none}
  .row{grid-template-columns:40px minmax(0,1fr) 44px;padding-left:4px;padding-right:0}
  .row .num,.row .date{display:none}
  .row .meta{display:block}
  .toolbar .up{display:none}
  .sacts{width:100%;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
  .sacts .sb{flex-direction:column;gap:2px;font-size:12px;min-height:52px;padding:4px 2px}
  .sacts .bl{max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .fab{display:inline-flex;position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom) + var(--ph,0px));z-index:25;min-height:54px;padding:0 20px;border-radius:27px;box-shadow:var(--shadow)}
  .uploads{right:0;left:0;bottom:0;width:auto;max-width:none;border-radius:var(--r-lg) var(--r-lg) 0 0;padding-bottom:env(safe-area-inset-bottom)}
  .scrim{background:rgba(10,12,14,.45)}
  .menu{left:0!important;right:0;top:auto!important;bottom:0;max-width:none;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:8px 8px calc(12px + env(safe-area-inset-bottom))}
  .menu .mhead{display:block;padding:10px 12px 8px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .menu button{min-height:52px}
  .list{padding-bottom:calc(var(--ph,0px) + 96px)}
  .item{padding:14px 16px;flex-wrap:wrap}
  .item .inner{flex-wrap:wrap}
  .li{padding-left:16px}
  .foot{padding:12px 16px}
  .toasts{left:16px;right:16px;max-width:none;align-items:stretch;bottom:calc(86px + env(safe-area-inset-bottom))}
  .has-panel .toasts{bottom:calc(var(--ph,0px) + 12px)}
  .has-panel .fab{display:none}
  .seg button{min-height:40px}
  .tabs a{padding:10px 14px}
  .back{padding:10px 10px 10px 4px}
  .uploads .x{width:40px;height:40px}
}
@media (max-width:359px){.fab .fl,.sacts .bl{display:none}.fab{padding:0;width:54px}.seg button{padding:7px 10px}}
</style>

let lang = "de", loc = "de-DE", nf, TF, DF;
function t(k, ...a){ const v = k in L[lang] ? L[lang][k] : L.de[k]; return typeof v === "function" ? v(...a) : v === undefined ? k : v; }

  document.documentElement.lang = lang;
  nf = new Intl.NumberFormat(loc, {maximumFractionDigits: 1});

  TF = new Intl.DateTimeFormat(loc, {hour: "2-digit", minute: "2-digit", timeZone: "UTC"});
  DF = new Intl.DateTimeFormat(loc, lang === "de" ? {day: "2-digit", month: "2-digit", year: "numeric", timeZone: "UTC"} : {day: "numeric", month: "short", year: "numeric", timeZone: "UTC"});
  $$("[data-t]").forEach(e => e.textContent = t(e.dataset.t));

  $$("[data-tt]").forEach(e => { e.setAttribute("aria-label", t(e.dataset.tt)); e.title = t(e.dataset.tt); });
  $$("[data-tp]").forEach(e => e.placeholder = t(e.dataset.tp));
  $$("[data-lang]").forEach(e => { e.textContent = t("otherLang"); e.lang = lang === "de" ? "en" : "de"; });
}
function fsize(b){ const u = ["B","kB","MB","GB","TB"]; let i = 0; while (b >= 1024 && i < 4) { b /= 1024; i++; } return nf.format(b) + " " + u[i]; }
function fdate(s){
  if (!s) return "–";
  const d = new Date(s * 1000), now = new Date(Date.now() - new Date().getTimezoneOffset() * 60000);
  const day = x => Math.floor(x.getTime() / 864e5), diff = day(now) - day(d);
  if (diff === 0) return t("today") + ", " + TF.format(d);
  if (diff === 1) return t("yesterday") + ", " + TF.format(d);
  return DF.format(d);
}
const localSecs = ms => Math.floor(ms / 1000) - new Date(ms).getTimezoneOffset() * 60;
const CATS = {model: "3mf stl obj step stp gcode amf", image: "jpg jpeg png gif webp svg bmp heic", doc: "pdf txt md doc docx odt xls xlsx csv ppt pptx", archive: "zip 7z rar gz tar", media: "mp3 wav flac m4a mp4 mov mkv avi"};
function ftype(name){
  const m = /\.([^.]+)$/.exec(name), ext = m ? m[1].toLowerCase() : "";
  const cat = Object.keys(CATS).find(c => CATS[c].split(" ").includes(ext)) || "";

/* ---------- Toasts, dialogs, menus, busy overlay ---------- */
function toast(text, err){

  const el = document.createElement("div");

/* ask({title, text|html, yes, no, danger, input|fields, run})

   Resolves false (cancelled), true (no fields), the value (input) or the list of values (fields).
   run(value) may return an error string: the dialog then stays open and shows it.
   o.out receives the field values also when the dialog was cancelled. */
let dlgQueue = Promise.resolve(), dlgCancel = null;

  const p = dlgQueue.then(() => askNow(o));

}
function askNow(o){
  return new Promise(resolve => {
    if (S.auth !== "ok") return resolve(false);          // signed out meanwhile: drop queued questions
    const d = $("#dlg"), yes = $("#dYes"), no = $("#dNo"), fields = o.fields || (o.input ? [o.input] : []);
    $("#dTitle").textContent = o.title;
    $("#dBody").innerHTML = o.html || (o.text ? `<p>${esc(o.text)}</p>` : "");
    $("#dErr").textContent = "";
    $("#dFields").innerHTML = fields.map((f, i) => f.type === "check"
      ? `<label class="chk"><input type="checkbox" id="dF${i}"> ${esc(f.label)}</label>`
      : `<div><label class="lbl" for="dF${i}">${esc(f.label)}</label>${f.options
        ? `<select class="field" id="dF${i}">${f.options.map(([v, l]) => `<option value="${esc(v)}"${v === f.value ? " selected" : ""}>${esc(l)}</option>`).join("")}</select>`
        : `<input class="field" id="dF${i}" type="${f.type || "text"}" autocomplete="${f.auto || "off"}" spellcheck="false" autocapitalize="none"${f.max ? ` maxlength="${f.max}"` : ""}>`}</div>`).join("");
    const els = fields.map((f, i) => { const el = $("#dF" + i); if (el.tagName === "INPUT" && f.type !== "check") { el.value = f.value || ""; el.placeholder = f.placeholder || ""; } return el; });
    const vals = () => fields.map((f, i) => f.type === "check" ? els[i].checked : f.type === "password" || f.raw || f.options ? els[i].value : els[i].value.trim());
    yes.textContent = o.yes || t("ok"); yes.className = "btn " + (o.danger ? "danger" : "primary"); yes.disabled = false;
    no.textContent = o.no || t("cancel"); no.disabled = false;
    let done = false, running = false;
    const finish = v => { if (done) return; done = true; dlgCancel = null; if (d.open) d.close(); resolve(v); };
    const cancel = () => { if (!running) { o.out = vals(); finish(false); } };

      e.preventDefault();

      const v = vals(), val = !fields.length ? true : o.input ? v[0] : v;

        const err = await o.run(val);
        if (done) return;                    // signed out while waiting
        running = false; yes.disabled = no.disabled = false;

}

    // Keep the extension visible when a long file name is shortened.

    const nm = `<span class="nb">${esc(split ? f.name.slice(0, dot) : f.name)}</span>${split ? `<span class="ne">${esc(f.name.slice(dot))}</span>` : ""}`;

/* ---------- selection and clipboard bars ---------- */

  list.classList.toggle("selmode", sm);

$("#list").addEventListener("pointermove", e => { if (lpXY && Math.hypot(e.clientX - lpXY[0], e.clientY - lpXY[1]) > 10) clearTimeout(lpTimer); });
["pointerup", "pointercancel"].forEach(n => $("#list").addEventListener(n, () => clearTimeout(lpTimer)));
$("#search").addEventListener("input", e => { S.q = e.target.value.trim(); renderList(); });

const rowOf = name => $$(".row").find(x => x.dataset.name === name);
const rowButton = name => { const r = rowOf(name); return r ? r.querySelector("[data-more]") : null; };
function itemMenu(row, ev){
  const name = row.dataset.name, isDir = row.classList.contains("dir");
  const items = [isDir ? ["open", "folder", t("open")] : ["dl", "download", t("download")],
    ["ren", "edit", t("rename")], ["cut", "cut", t("cut")], ["copy", "copy", t("copy")], ["sel", "check", t("select")], ["del", "trash", t("delete"), 1]];

/* ---------- File and folder actions ---------- */
function download(name){
  if (blocked()) return;
  const a = document.createElement("a");
  a.href = "/api/download?path=" + enc(join(S.dir, name)); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
const BAD_CHARS = /[\/\\:*?"<>|\x00-\x1f]/;
function nameErr(v, dir){
  if (!v) return t("nameEmpty");
  if (BAD_CHARS.test(v) || /^[. ]|[. ]$/.test(v)) return t("nameChars");
  if (bytes(v) > 120) return t("nameLong");
  const p = join(dir, v);
  return bytes(p) > 240 || p.split("/").length > 8 ? t("pathLong") : "";
}
async function rename(name){
  if (blocked()) return;
  const dir = S.dir, e = entry(name), isDir = !!e && e.type === "dir", dot = name.lastIndexOf(".");
  const to = await ask({
    title: t(isDir ? "renDirT" : "renFileT"), yes: t("rename"),
    input: {label: t("newName"), value: name, select: !isDir && dot > 0 ? dot : 0},
    run: async v => {
      if (v === name) return "";
      const err = nameErr(v, dir); if (err) return err;
      const r = await post(`/api/move?from=${enc(join(dir, name))}&to=${enc(join(dir, v))}`);
      return r.ok ? "" : errText(r, "ren");
    }
  });
  if (to && to !== name) { await refresh(true); toast(t("renamed", to)); return to; }
}
async function mkdir(){
  if (blocked()) return;
  const dir = S.dir;
  const n = await ask({title: t("newDir"), yes: t("create"), input: {label: t("name"), placeholder: t("newDir")},
    run: async v => { const err = nameErr(v, dir); if (err) return err;
      const r = await post("/api/mkdir?path=" + enc(join(dir, v))); return r.ok ? "" : errText(r, "mk"); }});
  if (n) { await refresh(true); toast(t("dirMade", n)); const b = rowButton(n); if (b) b.focus(); }
}
$("#mkBtn").onclick = mkdir;
const delPath = (dir, i) => `/api/delete?path=${enc(join(dir, i.name))}${i.type === "dir" ? "&recursive=1" : ""}`;
async function del(names){
  if (blocked()) return;
  const dir = S.dir, items = names.map(n => entry(n)).filter(Boolean);
  if (!items.length) return;
  if (items.length === 1) {
    const i = items[0], isDir = i.type === "dir";
    const ok = await ask({title: isDir ? t("delDirT", i.name) : t("delFileT"), text: isDir ? t("delDirX") : t("delFileX", i.name), yes: t("delete"), danger: true,
      run: async () => {
        S.busy = "del";
        try { const r = await post(delPath(dir, i), {timeout: 180000}); return r.ok ? "" : errText(r); }
        finally { S.busy = ""; }
      }});
    if (ok) { S.sel.delete(i.name); await refresh(true); toast(t("deleted")); }
    return;
  }
  const dirs = items.filter(i => i.type === "dir").length;
  if (!await ask({title: t("delManyT", items.length), text: t("delManyX", dirs), yes: t("delete"), danger: true})) return;
  let done = 0, err = "";
  S.busy = "del";
  try {
    for (const [n, i] of items.entries()) {
      busyOn(t("deleting", n + 1, items.length), t("busyX"));
      const r = await post(delPath(dir, i), {timeout: 180000});
      if (r.ok) { done++; S.sel.delete(i.name); }
      else { err = `${i.name}: ${errText(r)}`; if (r.code !== "NOT_FOUND") break; }
    }
  } finally { S.busy = ""; busyOff(); }
  if (S.auth !== "ok") return;
  if (!S.sel.size) S.selMode = false;
  await refresh(true);
  if (done) toast(t("deletedN", done));
  if (err) toast(err, true);
}

/* ---------- clipboard: cut / copy, then paste in another folder ---------- */
function clipSet(op, names){
  if (blocked()) return;
  const items = names.map(n => entry(n)).filter(Boolean).map(e => ({name: e.name, type: e.type}));
  if (!items.length) return;
  S.clip = {op, dir: S.dir, items};
  S.sel.clear(); S.selMode = false;
  renderList();
  $("#clipPaste").focus();
}
function freeName(name, taken, isDir){
  const dot = name.lastIndexOf("."), split = !isDir && dot > 0;
  const stem = split ? name.slice(0, dot) : name, ext = split ? name.slice(dot) : "";
  for (let n = 2; ; n++) { const c = `${stem} (${n})${ext}`; if (!taken.has(c.toLowerCase())) return c; }
}
const FATAL = ["NO_SPACE", "OFFLINE", "WRONG_OWNER", "BUSY", "IO", "UNAUTHORIZED", "MUST_CHANGE_PASSWORD", "FORBIDDEN_ROLE", "HTTP"];
async function paste(){
  const c = S.clip; if (!c || blocked()) return;
  const dest = S.dir, copy = c.op === "copy";
  if (!copy && c.dir === dest) return toast(t("alreadyHere"));
  const taken = new Set((S.entries || []).map(e => e.name.toLowerCase()));
  let done = 0, skipped = 0, all = null, stop = false;
  const errs = [], left = [];
  S.busy = c.op;
  try {
    for (let i = 0; i < c.items.length && !stop; i++) {
      const it = c.items[i], from = join(c.dir, it.name);
      if (it.type === "dir" && (dest === from || dest.startsWith(from + "/"))) { errs.push(t("intoSelf", it.name)); left.push(it); continue; }
      let name = it.name;
      for (let tries = 0; ; tries++) {
        const to = join(dest, name);
        if (bytes(to) > 240 || to.split("/").length > 8) { errs.push(`${it.name}: ${t("pathLong")}`); left.push(it); break; }
        if (copy) busyOn(t("copying", name, i + 1, c.items.length), t("copyingX"));
        const r = await post(`/api/${copy ? "copy" : "move"}?from=${enc(from)}&to=${enc(to)}`, {timeout: copy ? 3600000 : 60000});
        busyOff();
        if (r.ok) { done++; taken.add(name.toLowerCase()); break; }
        if (r.code === "EXISTS" && tries < 50) {
          taken.add(name.toLowerCase());
          let choice = all;
          if (!choice) {
            const o = {title: t("existsT", name), text: t("existsX"), yes: t("newNameBtn"), no: t("skip"),
              fields: c.items.length - i > 1 ? [{type: "check", label: t("forAll")}] : []};
            const res = await ask(o);
            if (S.auth !== "ok") { stop = true; break; }
            choice = res ? "rename" : "skip";
            if (o.out && o.out[0]) all = choice;
          }
          if (choice === "skip") { skipped++; left.push(it); break; }
          name = freeName(it.name, taken, it.type === "dir");
          continue;
        }
        errs.push(`${it.name}: ${errText(r, "paste")}`); left.push(it);
        if (FATAL.includes(r.code)) stop = true;
        break;
      }
    }
  } finally { S.busy = ""; busyOff(); }
  if (S.auth !== "ok") return;
  if (!copy) S.clip = left.length && done === 0 ? c : null;   // moved items are gone from the source
  await refresh(true);
  const msg = (done ? t(copy ? "copiedN" : "movedN", done) : "") + (skipped ? (done ? " " : "") + t("skippedN", skipped) : "");
  if (msg) toast(msg);
  if (errs.length) toast(errs.slice(0, 3).join(" "), true);
}

/* ---------- Switching between USB drive and file management (unchanged safety flow) ---------- */
async function activate(){
  if (S.switching) return false;
  S.switching = "app"; render();
  try {
    let r = await post("/api/mode?target=app");
    if (r.code === "HOST_ACTIVE") {
      S.switching = ""; render();
      const ok = await ask({title: t("hostActT"), yes: t("hostActYes"), danger: true, html: t("hostActX")});
      if (!ok) return false;
      S.switching = "app"; render();
      r = await post("/api/mode?target=app&force=1");
    }
    if (!r.ok) { if (S.auth === "ok") toast(errText(r), true); return false; }
    await refresh(true);
    return true;
  } finally { S.switching = ""; render(); }
}
async function provide(quiet){
  if (S.switching) return false;
  S.switching = "usb"; render();

    const r = await post("/api/mode?target=usb");

/* ---------- Uploads into the current folder ---------- */
function pick(){ $("#picker").click(); }
$("#upBtn").onclick = $("#fab").onclick = $("#upMore").onclick = pick;
$("#picker").onchange = e => { addFiles(e.target.files); e.target.value = ""; };

function addFiles(list){
  const files = Array.from(list || []);
  if (!files.length) return;
  if (S.busy) return toast(t("waitBusy"));
  for (const f of files) S.ups.push({id: ++S.upSeq, file: f, name: f.name, dir: S.dir, size: f.size, state: "queued", pct: 0, msg: t("upQueued")});
  renderUploads();
  work();
}
const endUp = (u, state, msg) => { u.state = state; u.msg = msg; u.xhr = null; renderUploads(); };

async function work(){
  if (S.working) return;
  S.working = true; render();
  let okCount = 0, tookOver = false;
  const failQueued = msg => S.ups.filter(u => u.state === "queued").forEach(u => endUp(u, "err", msg));
  try {
    if (!await refresh()) failQueued(t(S.auth === "ok" ? "upNoConn" : "upOut"));
    else if (broken(S.st.drive)) failQueued(t("upBroken"));
    else {
      if (S.st.drive.owner === "usb") {
        if (await activate()) tookOver = true;
        else failQueued(t(S.auth === "ok" ? "upNoApp" : "upOut"));
      }
      let u;
      while (S.auth === "ok" && (u = S.ups.find(x => x.state === "queued"))) { await uploadOne(u); if (u.state === "done") okCount++; }
    }
  } finally { S.working = false; }
  if (S.auth !== "ok") { failQueued(t("upOut")); return; }
  await refresh(true);
  if (okCount) {
    const what = t("savedN", okCount);
    if (tookOver && pref.get("auto", "1") === "1") toast(await provide(true) ? what + " " + t("reprovided") : what);
    else toast(what);
  }
  render();
  // A finished queue without problems needs no attention: close the panel after a moment.
  setTimeout(() => { if (!S.working && S.ups.length && !S.ups.some(u => u.state === "err")) { S.ups = []; renderUploads(); } }, 6000);
}

// POST a raw body with progress; resolves the parsed answer, {code:"OFFLINE"} or {code:"ABORT"}.
function xpost(url, body, onprog, keep){
  return new Promise(resolve => {
    const x = new XMLHttpRequest();
    if (keep) keep(x);
    x.open("POST", url);
    x.setRequestHeader("X-PrintDrive", "1");
    x.setRequestHeader("Content-Type", "application/octet-stream");
    x.upload.onprogress = e => { if (e.lengthComputable) onprog(e.loaded, e.total); };
    x.onload = () => { let j = null; try { j = JSON.parse(x.responseText); } catch(e) {} resolve(j || {ok: false, code: "HTTP", status: x.status}); };
    x.onerror = () => resolve({ok: false, code: "OFFLINE"});
    x.onabort = () => resolve({ok: false, code: "ABORT"});
    x.send(body);
  });
}

function upErr(r, sent){
  const k = {UNAUTHORIZED: "upOut", MUST_CHANGE_PASSWORD: "upPw", OFFLINE: sent ? "upLost" : "upNoConn", HTTP: "upBad"}[r.code];
  return k ? t(k) : errText(r, "up");
}
async function uploadOne(u){
  const types = S.st.types;
  if (types !== "all" && !types.split(",").some(x => u.name.toLowerCase().endsWith(x))) return endUp(u, "err", t("upType", types.replace(/,/g, ", ")));
  if (!u.size) return endUp(u, "err", t("upEmpty"));
  if (u.size >= GIB4) return endUp(u, "err", t("upBig"));
  const bad = nameErr(u.name, u.dir); if (bad) return endUp(u, "err", bad);
  u.state = "check"; u.msg = t("upChecking"); renderUploads();
  const q = `path=${enc(join(u.dir, u.name))}&size=${u.size}`;
  let over = 0, c = await post(`/api/upload/check?${q}&overwrite=0`);
  if (c.code === "EXISTS") {
    const ok = await ask({title: t("upExistsT"), text: t("upExistsX", u.name), yes: t("replace"), no: t("skip"), danger: true});
    if (S.auth !== "ok") return endUp(u, "err", t("upOut"));
    if (!ok) return endUp(u, "skip", t("upSkipped"));
    over = 1; c = await post(`/api/upload/check?${q}&overwrite=1`);
  }
  if (!c.ok) return endUp(u, "err", upErr(c));
  if (u.state === "cancel") return;

  u.state = "up"; u.pct = 0; u.msg = "0 %"; renderUploads();
  const lm = u.file.lastModified || Date.now();
  let t0 = performance.now(), last = 0, rate = 0;
  const j = await xpost(`/api/upload?path=${enc(join(u.dir, u.name))}&overwrite=${over}&mtime=${localSecs(lm)}&now=${localSecs(Date.now())}`, u.file, (loaded, total) => {
    const now = performance.now(), dt = (now - t0) / 1000;
    if (dt > .4) { const r = (loaded - last) / dt; rate = rate ? rate * .7 + r * .3 : r; t0 = now; last = loaded; }
    u.pct = loaded / total * 100;
    const rest = rate ? (total - loaded) / rate : 0;
    // 100 % only means "sent"; the file counts as saved once the device confirms it.
    u.msg = loaded >= total ? t("upSaving") : Math.floor(u.pct) + " %" + (rest > 5 ? " · " + t("upLeft", rest > 90 ? Math.round(rest / 60) + " min" : Math.round(rest) + " s") : "");
    if (loaded >= total && !u.sent) { u.sent = true; renderUploads(); }
    else paintUpload(u);
  }, x => u.xhr = x);
  if (j.ok) { u.pct = 100; endUp(u, "done", t("upDone")); }
  else if (j.code === "ABORT") endUp(u, "cancel", t("upCancelled"));
  else { endUp(u, "err", upErr(j, true)); authFail(j); }
}

function paintUpload(u){
  const li = document.getElementById("up" + u.id); if (!li) return;
  li.querySelector(".s").textContent = u.msg;
  const bar = li.querySelector(".bar>i"); if (bar) bar.style.width = u.pct.toFixed(1) + "%";
}
const LIVE = ["queued", "check", "up"];
function renderUploads(){
  const box = $("#uploads");
  box.hidden = !S.ups.length;
  if (S.ups.length) {
    const active = S.ups.filter(u => LIVE.includes(u.state)).length;
    const done = S.ups.filter(u => u.state === "done").length, failed = S.ups.filter(u => u.state === "err").length;
    $("#upHead").textContent = active ? t("upHeadActive", active) : failed ? t("upHeadFail", failed, S.ups.length) : done ? t("upHeadDone", done) : t("uploads");
    $("#upClose").hidden = active > 0;
    $("#upList").innerHTML = S.ups.map(u => {
      const live = LIVE.includes(u.state) && !u.sent;
      return `<li id="up${u.id}"><div class="l1"><span class="n" title="${esc(join(u.dir, u.name))}">${esc(u.name)}</span>
        <span class="s ${u.state === "done" ? "ok" : ""}">${u.state === "err" ? "" : esc(u.msg)}</span>
        ${live ? `<button class="icon-btn x" data-cancel="${u.id}" aria-label="${esc(t("upCancel"))}" title="${esc(t("upCancel"))}">${icon("x")}</button>` : ""}</div>
        ${u.state === "up" ? `<div class="bar"><i style="width:${u.pct.toFixed(1)}%"></i></div>` : ""}
        ${u.state === "err" ? `<div class="s err">${esc(u.msg)}</div>` : ""}</li>`;
    }).join("");
  }
  document.body.style.setProperty("--ph", (box.hidden ? 0 : box.offsetHeight) + "px");
  document.body.classList.toggle("has-panel", !box.hidden);
}
$("#upList").onclick = e => {
  const b = e.target.closest("[data-cancel]"); if (!b) return;
  const u = S.ups.find(x => x.id === +b.dataset.cancel); if (!u || u.sent) return;
  if (u.xhr) u.xhr.abort(); else endUp(u, "cancel", t("upCancelled"));
};
$("#upClose").onclick = () => { S.ups = []; renderUploads(); };
addEventListener("beforeunload", e => { if (S.working || S.busy) { e.preventDefault(); e.returnValue = ""; } });

/* drag & drop anywhere in the window (into the current folder) */
let dragDepth = 0;
const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files");
const canDrop = () => S.auth === "ok" && S.st && !broken(S.st.drive) && !inSettings();
addEventListener("dragenter", e => {
  if (!hasFiles(e) || !canDrop()) return;
  e.preventDefault(); dragDepth++;
  $("#drop").textContent = S.dir && fileMode() ? t("dropIn", base(S.dir)) : t("dropHere"); $("#drop").hidden = false;
});
addEventListener("dragover", e => { if (hasFiles(e)) e.preventDefault(); });
addEventListener("dragleave", () => { if (dragDepth && --dragDepth === 0) $("#drop").hidden = true; });
addEventListener("drop", e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth = 0; $("#drop").hidden = true; if (canDrop()) addFiles(e.dataTransfer.files); });

/* ---------- Settings ---------- */
function renderSettings(){
  if (!inSettings() || !S.me) return;
  const th = pref.get("theme", "");
  $$("#theme button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === th)));
  $$("#langSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === lang)));
  $("#acctX").textContent = t("acctX", S.me.user, roleName(S.me.role));
  $("#swAuto").checked = pref.get("auto", "1") === "1";
  const st = S.st; if (!st) return;
  const w = st.wifi, d = st.drive, used = Math.max(0, d.total - d.free);
  $("#netTitle").textContent = w.sta_connected ? t("netOn", w.ssid) : w.sta_configured ? t("netConnecting", w.ssid) : t("netNone");
  $("#netSub").textContent = w.sta_connected ? t(w.rssi >= -60 ? "rssi3" : w.rssi >= -72 ? "rssi2" : "rssi1") : w.ap_active ? t("apOn", w.ap_ssid) : "";
  $("#netAddr").textContent = w.sta_connected ? "http://" + w.ip : w.ap_active ? "http://" + w.ap_ip : "–";
  $("#netHost").textContent = "http://" + w.hostname + ".local";
  $("#secAp").textContent = (w.ap_active ? t("apOn", w.ap_ssid) + " " : "") + t("apX");
  $("#suMedium").textContent = st.medium.sd ? t("sd") + (st.medium.name ? " (" + st.medium.name + ")" : "") : t("flash");
  $("#suUsed").textContent = d.total ? t("nOf", fsize(used), fsize(d.total)) : "–";
  $("#suFree").textContent = d.total ? fsize(d.free) : "–";
  if (document.activeElement !== $("#swWrite")) $("#swWrite").checked = d.host_writable;
  $("#secTypes").textContent = st.types === "all" ? t("typesAll") : t("typesSome", st.types.replace(/,/g, ", "));
  $("#sysVer").textContent = st.version;
  $("#sysSlot").textContent = st.ota && st.ota.partition || "–";
  $("#otaPend").hidden = !(st.ota && st.ota.pending_verify);
  $("#sysUp").textContent = t("dur", st.uptime_s);
  $("#sysHeap").textContent = fsize(st.heap);
  $("#fmtSub").textContent = t("fmtX", t(st.medium.sd ? "whereSd" : "whereFlash"));
  $("#foot").textContent = "WiFi DataDrive " + st.version;
}
async function loadAdmin(){
  if (S.working || S.busy) return;
  await loadDevices();
  if (!isAdmin()) return;
  await loadWifi();
  await loadUsers();
}

$("#theme").onclick = e => { const b = e.target.closest("button"); if (!b) return; pref.set("theme", b.dataset.v); applyTheme(); renderSettings(); };
$("#langSeg").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  pref.set("lang", b.dataset.v); setLang(b.dataset.v);
  if (S.me) setMe({user: S.me.user, role: S.me.role, default_password: S.me.def});
  listSig = ""; render(); renderUploads(); renderWifi(); renderUsers(); renderDevices();
};
$("#swAuto").onchange = e => pref.set("auto", e.target.checked ? "1" : "0");
$("#swWrite").onchange = async e => {
  if (blocked()) { e.target.checked = !e.target.checked; return; }
  const want = e.target.checked, r = await post("/api/settings/host_writable?value=" + (want ? 1 : 0));
  if (!r.ok) { e.target.checked = !want; if (S.auth === "ok") toast(errText(r), true); return; }
  await refresh();
  toast(t(want ? "usbWriteOn" : "usbWriteOff"));
};

/* ---------- trusted devices (own ones; administrators see all) ---------- */
async function loadDevices(){ const j = await api("/api/devices"); S.devs = j.ok ? j : null; renderDevices(); }
function renderDevices(){
  const v = S.devs, box = $("#devList");
  $("#devCount").textContent = v ? t("devCount", v.devices.length, v.max) : "";
  if (!v) { box.innerHTML = `<div class="li"><span class="txt small">${t("devLoadErr")}</span></div>`; return; }
  box.innerHTML = v.devices.map(x => `<div class="li">${icon("device")}<span class="txt">${esc(x.label || "–")}${x.current ? `<span class="pill">${t("thisDev")}</span>` : ""}${isAdmin() ? `<small>${esc(t("acctL", x.user))}</small>` : ""}</span>
    <button class="icon-btn" data-ddel="${esc(x.id)}" aria-label="${esc(t("removeX", x.label))}" title="${esc(t("removeX", x.label))}">${icon("trash")}</button></div>`).join("")
    || `<div class="li"><span class="txt small">${t("devNone")}</span></div>`;
}
$("#devList").onclick = async e => {
  const b = e.target.closest("[data-ddel]"); if (!b || !S.devs || blocked()) return;
  const d = S.devs.devices.find(x => x.id === b.dataset.ddel); if (!d) return;
  const ok = await ask({title: t("devDelT", d.label), text: t(d.current ? "devDelSelf" : "devDelX"), yes: t("remove"), danger: true,
    run: async () => { const r = await post("/api/devices/delete?id=" + enc(d.id)); return r.ok ? "" : errText(r, "dev"); }});
  if (!ok || S.auth !== "ok") return;
  if (d.current) { S.auth = "login"; leaveApp(t("upOut")); $("#lPass").value = ""; return showLogin("out"); }
  toast(t("removed", d.label)); await loadDevices();
};

/* ---------- Wi-Fi networks (admin) ---------- */
async function loadWifi(){ const j = await api("/api/wifi/list"); S.wifi = j.ok ? j : null; renderWifi(); }
function renderWifi(){
  const w = S.wifi, box = $("#wifiList");
  $("#wifiCount").textContent = w ? t("wifiCount", w.networks.length, w.max) : "";
  if (!w) { box.innerHTML = `<div class="li"><span class="txt small">${t("wifiLoadErr")}</span></div>`; return; }
  box.innerHTML = w.networks.map(n => `<div class="li">${icon("wifi")}<span class="txt">${esc(n.ssid)}${n.active ? `<span class="pill">${t("connected")}</span>` : ""}</span>
    <button class="icon-btn" data-wdel="${esc(n.ssid)}" aria-label="${esc(t("removeX", n.ssid))}" title="${esc(t("removeX", n.ssid))}">${icon("trash")}</button></div>`).join("")
    || `<div class="li"><span class="txt small">${t("wifiNone")}</span></div>`;
}
$("#wifiAdd").onclick = async () => {
  if (blocked()) return;
  const v = await ask({title: t("wifiAdd"), text: t("wifiAddX"), yes: t("save"),
    fields: [{label: t("ssid"), max: 32, raw: true}, {label: t("wifiPassL"), type: "password", auto: "new-password", max: 63}],
    run: async ([ssid, pass]) => {
      if (!ssid.trim()) return t("ssidEmpty");
      if (bytes(ssid) > 32) return t("ssidLong");
      if (pass.length && (pass.length < 8 || pass.length > 63)) return t("wifiPwLen");
      const r = await post("/api/wifi/add", {body: form({ssid, pass})});
      return r.ok ? "" : errText(r, "wifi");
    }});
  if (v) { toast(t("wifiAdded", v[0])); await loadWifi(); }
};
$("#wifiList").onclick = async e => {
  const b = e.target.closest("[data-wdel]"); if (!b || blocked()) return;
  const ssid = b.dataset.wdel, n = S.wifi && S.wifi.networks.find(x => x.ssid === ssid);
  const ok = await ask({title: t("wifiDelT", ssid), text: n && n.active ? t("wifiDelActive") : t("wifiDelX"), yes: t("remove"), danger: true,
    run: async () => { const r = await post("/api/wifi/delete?ssid=" + enc(ssid)); return r.ok ? "" : errText(r, "wifi"); }});
  if (ok) { toast(t("removed", ssid)); await loadWifi(); }
};

/* ---------- users (admin) ---------- */
async function loadUsers(){ const j = await api("/api/users"); S.users = j.ok ? j : null; renderUsers(); }
function renderUsers(){
  const u = S.users, box = $("#userList");
  $("#userCount").textContent = u ? t("usersCount", u.users.length, u.max) : "";
  if (!u || !S.me) { box.innerHTML = `<div class="li"><span class="txt small">${t("usersLoadErr")}</span></div>`; return; }
  box.innerHTML = u.users.map(x => `<div class="li"><span class="av">${esc(x.name.slice(0, 1))}</span><span class="txt">${esc(x.name)}${same(x.name, S.me.user) ? `<span class="pill">${t("you")}</span>` : ""}<small>${esc(roleName(x.role))}</small></span>
    <button class="icon-btn" data-umore="${esc(x.name)}" aria-haspopup="menu" aria-label="${esc(t("actionsFor", x.name))}">${icon("more")}</button></div>`).join("");
}
$("#userList").onclick = e => {
  const b = e.target.closest("[data-umore]"); if (!b || !S.users) return;
  const u = S.users.users.find(x => x.name === b.dataset.umore); if (!u) return;
  const self = same(u.name, S.me.user);
  showMenu(b, null, esc(u.name), [["role", "user", t(u.role === "admin" ? "mkUser" : "mkAdmin")], ["pw", "key", t("setPw")], ["del", "trash", t("delete"), 1]], a => userAct(a, u, self));
};
async function userAct(a, u, self){
  if (blocked()) return;
  if (a === "pw" && self) return changeOwnPw();
  let ok;
  if (a === "role") {
    const to = u.role === "admin" ? "user" : "admin";
    ok = await ask({title: t("roleT", u.name, to === "admin"), text: to === "admin" ? t("roleXAdmin") : t("roleXUser") + (self ? " " + t("roleXSelf") : ""), yes: t("change"), danger: self && to === "user",
      run: async () => { const r = await post(`/api/users/role?user=${enc(u.name)}&role=${to}`); return r.ok ? "" : errText(r, "user"); }});
    if (ok) toast(t("roleDone", u.name));
  } else if (a === "pw") {
    ok = await ask({title: t("setPwT", u.name), text: t("setPwX"), yes: t("save"),
      fields: [{label: t("pwNew"), type: "password", auto: "new-password"}, {label: t("pwNew2"), type: "password", auto: "new-password"}],
      run: async ([p1, p2]) => { const err = pwErr(p1, p2); if (err) return err;
        const r = await post("/api/users/password", {body: form({user: u.name, pass: p1})}); return r.ok ? "" : errText(r, "user"); }});
    if (ok) toast(t("pwSetFor", u.name));
  } else {
    ok = await ask({title: t("userDelT", u.name), text: t("userDelX") + (self ? " " + t("userDelSelf") : ""), yes: t("delete"), danger: true,
      run: async () => { const r = await post("/api/users/delete?user=" + enc(u.name)); return r.ok ? "" : errText(r, "user"); }});
    if (ok) toast(t("userDeleted", u.name));
  }
  if (!ok || S.auth !== "ok") return;
  if (self && a !== "pw") return recheck();      // own role or own account changed
  await loadUsers(); await loadDevices();       // the user's trusted devices were removed
}
$("#userAdd").onclick = async () => {
  if (blocked()) return;
  const v = await ask({title: t("userAdd"), yes: t("create"),
    fields: [{label: t("userName"), max: 24}, {label: t("password"), type: "password", auto: "new-password"}, {label: t("role"), options: [["user", t("roleUser")], ["admin", t("roleAdmin")]], value: "user"}],
    run: async ([name, pass, role]) => {
      if (!/^[A-Za-z0-9._-]{1,24}$/.test(name)) return errText({code: "BAD_USER"});
      const n = bytes(pass); if (n < 5 || n > 64) return errText({code: "BAD_PASSWORD"});
      const r = await post("/api/users/add", {body: form({user: name, pass, role})});
      return r.ok ? "" : errText(r, "user");
    }});
  if (v) { toast(t("userAdded", v[0])); await loadUsers(); }
};

/* ---------- log, restart, update, format, maintenance (admin) ---------- */
$("#logBtn").onclick = async () => {
  if (blocked()) return;
  const pre = $("#log"), btn = $("#logBtn");
  btn.disabled = true;
  const txt = await api("/api/log", {text: true});
  btn.disabled = false; btn.dataset.t = "refresh"; btn.textContent = t("refresh");
  pre.hidden = false; pre.textContent = typeof txt === "string" ? txt || t("logEmpty") : t("logErr");
  pre.scrollTop = pre.scrollHeight;
};
function awaitRestart(kind){ S.restart = kind; S.sawDown = false; S.entries = null; renderNotice(); schedule(2500); }
$("#rebootBtn").onclick = async () => {
  if (blocked()) return;
  const ok = await ask({title: t("rebootQ"), text: t("rebootX"), yes: t("rebootT"),
    run: async () => { const r = await post("/api/reboot?mode=normal"); return r.ok ? "" : errText(r); }});
  if (ok) awaitRestart("normal");
};
$("#flashBtn").onclick = async () => {
  if (blocked()) return;
  const ok = await ask({title: t("maintQ"), yes: t("maintYes"), danger: true, text: t("maintX"),
    run: async () => { const r = await post("/api/reboot?mode=download"); return r.ok ? "" : errText(r); }});
  if (ok) awaitRestart("download");
};
$("#fmtBtn").onclick = async () => {
  if (!S.st || blocked()) return;
  const took = S.st.drive.owner === "usb";   // formatting needs the file management to own the drive
  if (took && !await activate()) return;
  const where = t(S.st.medium.sd ? "whereSd" : "whereFlash");
  const ok = await ask({title: t("fmtQ"), yes: t("fmtYes"), danger: true, text: t("fmtQX", where),
    input: {label: t("fmtConfirm"), placeholder: t("fmtWord")},
    run: async v => {
      if (v.toUpperCase() !== t("fmtWord")) return t("fmtWrong");
      const r = await post("/api/format?confirm=FORMAT");
      return r.ok ? "" : r.code === "WRONG_OWNER" ? t("fmtOwner") : errText(r);
    }});
  if (ok) awaitRestart("format");
  else if (took && S.auth === "ok") await provide();            // cancelled: give the drive back to the USB device
};

$("#otaBtn").onclick = () => { if (!blocked()) $("#otaPick").click(); };
$("#otaPick").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if (f) ota(f); };
async function ota(f){
  const msg = $("#otaMsg"), prog = $("#otaProg"), fail = m => { msg.textContent = m; };
  fail("");
  // Cheap checks before sending 1–2 MB over Wi-Fi: an ESP32 image starts with the magic byte 0xE9.
  if (!/\.bin$/i.test(f.name)) return fail(t("otaNotBin"));
  if (f.size < OTA_MIN) return fail(t("otaSmall"));
  if (f.size > OTA_MAX) return fail(t("otaBig"));
  const head = new Uint8Array(await f.slice(0, 1).arrayBuffer());
  if (head[0] !== 0xE9) return fail(t("otaBad"));
  const ok = await ask({title: t("otaConfT"), text: t("otaConfX", f.name, fsize(f.size)), yes: t("otaGo")});
  if (!ok || blocked()) return;
  S.busy = "ota"; $("#otaBtn").disabled = true;
  $("#otaName").textContent = f.name; $("#otaPct").textContent = "0 %"; $("#otaBar").style.width = "0"; prog.hidden = false;
  const r = await xpost("/api/ota", f, (loaded, total) => {
    const p = Math.floor(loaded / total * 100);
    $("#otaPct").textContent = loaded >= total ? t("otaChecking") : t("otaSending", p);
    $("#otaBar").style.width = p + "%";
  });
  S.busy = ""; $("#otaBtn").disabled = false; prog.hidden = true;
  if (r.ok) return awaitRestart("update");
  authFail(r);
  if (S.auth === "ok") fail(r.code === "INVALID_FILE" ? t("otaBad") : r.code === "TOO_LARGE" ? t("otaBig") : errText(r, "ota"));
}

/* ---------- Routing: "#/Ordner/Unterordner" = folder, "#einstellungen" = settings, "#s-…" jumps to a settings section. ---------- */
function route(){
  if (S.auth !== "ok") return;
  const h = location.hash, sec = h.startsWith("#s-") ? document.getElementById(h.slice(1)) : null;
  const settings = h === "#einstellungen" || !!sec, was = inSettings();
  if (sec) history.replaceState(null, "", "#einstellungen");
  $("#vFiles").hidden = settings; $("#vSettings").hidden = !settings;
  $("#navSettings").hidden = settings;
  closeMenu();
  if (!settings) {
    const dir = parseDir(h);
    if (dir !== S.dir) {
      S.dir = dir; S.entries = null; S.sel.clear(); S.selMode = false;
      S.q = ""; $("#search").value = "";
      schedule(0);
    }
  } else {
    $("#backLink").href = dirHash(S.dir);
    if (!was) loadAdmin();
  }
  render();
  if (sec) sec.scrollIntoView({behavior: "smooth"}); else if (settings !== was || !settings) scrollTo(0, 0);
}
addEventListener("hashchange", route);
// Section chips only scroll; they must not add browser history entries.
document.querySelector(".tabs").onclick = e => {
  const a = e.target.closest("a"); if (!a) return;
  e.preventDefault();
  document.querySelector(a.getAttribute("href")).scrollIntoView({behavior: "smooth"});
};
document.addEventListener("visibilitychange", () => { if (!document.hidden) schedule(0); });

setLang(pref.get("lang", "") || (/^de/i.test(navigator.language || "") ? "de" : "en"));
boot();
</script>
