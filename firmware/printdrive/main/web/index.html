<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121416" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DataDrive">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>WiFi DataDrive</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b7a75'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'%3E%3Cpath d='M9.5 13a9.2 9.2 0 0 1 13 0'/%3E%3Cpath d='M12.7 16.2a4.7 4.7 0 0 1 6.6 0'/%3E%3C/g%3E%3Crect x='8' y='19.5' width='16' height='6' rx='2' fill='%23fff'/%3E%3Ccircle cx='20.5' cy='22.5' r='1.1' fill='%230b7a75'/%3E%3C/svg%3E">
<style>
/* ---------- Design tokens ---------- */
:root{
  --bg:#f7f7f5;--surface:#fff;--text:#1b1d21;--muted:#666b74;--line:#e5e6e2;--hover:#efefec;
  --accent:#09706b;--on-accent:#fff;--accent-soft:#e2f1ef;
  --usb:#5252cc;--usb-soft:#ebebfa;
  --warn:#9a5a05;--warn-soft:#fcf0da;
  --danger:#bd3328;--danger-soft:#fbe8e6;--on-danger:#fff;
  --shadow:0 8px 30px rgba(20,24,28,.16);--shadow-pop:0 14px 44px rgba(20,24,28,.24);
  --ease:cubic-bezier(.2,.8,.2,1);
  --r:10px;--r-lg:14px;
  --top:calc(64px + env(safe-area-inset-top));
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#121416;--surface:#1b1e21;--text:#e9eaec;--muted:#9da3ab;--line:#2b2f34;--hover:#24282c;
  --accent:#3dbfb6;--on-accent:#04211f;--accent-soft:#15302e;
  --usb:#a3a3f7;--usb-soft:#25254d;
  --warn:#efb45c;--warn-soft:#3a2c13;
  --danger:#f0766c;--danger-soft:#3e1d1a;--on-danger:#2b0c09;
  --shadow:0 8px 30px rgba(0,0,0,.5);--shadow-pop:0 14px 44px rgba(0,0,0,.62);
  color-scheme:dark;
}}
:root[data-theme=dark]{
  --bg:#121416;--surface:#1b1e21;--text:#e9eaec;--muted:#9da3ab;--line:#2b2f34;--hover:#24282c;
  --accent:#3dbfb6;--on-accent:#04211f;--accent-soft:#15302e;
  --usb:#a3a3f7;--usb-soft:#25254d;
  --warn:#efb45c;--warn-soft:#3a2c13;
  --danger:#f0766c;--danger-soft:#3e1d1a;--on-danger:#2b0c09;
  --shadow:0 8px 30px rgba(0,0,0,.5);--shadow-pop:0 14px 44px rgba(0,0,0,.62);
  color-scheme:dark;
}

/* ---------- Base ---------- */
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;letter-spacing:0;background:var(--bg);color:var(--text);font:0.9375rem/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
h1,h2,h3,p{margin:0}
h1{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;line-height:1.2}
h2{font-size:1rem;font-weight:650;letter-spacing:-.01em;line-height:1.3}
h3{font-size:0.9375rem;font-weight:600;line-height:1.35}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:984px;margin:0 auto;padding:0 max(1rem,env(safe-area-inset-right)) 0 max(1rem,env(safe-area-inset-left))}
.muted{color:var(--muted)}
.small{font-size:0.8125rem;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}

/* ---------- Controls ---------- */
button,input,select{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;min-height:44px;padding:0 1.125rem;border:0;border-radius:var(--r);background:var(--hover);font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;color:var(--text);transition:filter .12s}
.btn:hover{filter:brightness(.96)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.danger{background:var(--danger);color:var(--on-danger)}
.btn.outline{background:var(--surface);color:var(--accent);box-shadow:inset 0 0 0 1px var(--line)}
.btn.outline-danger{background:none;color:var(--danger);box-shadow:inset 0 0 0 1.5px var(--danger)}
.btn:disabled{opacity:.55;cursor:default;filter:none}
.icon-btn{width:44px;height:44px;display:inline-grid;place-items:center;border:0;border-radius:50%;background:none;cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.linkbtn{background:none;border:0;min-height:40px;padding:0 0.5rem;color:var(--accent);font-weight:600;cursor:pointer;border-radius:8px}
.field{width:100%;min-height:44px;padding:0 0.75rem;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.field:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
label.lbl{display:block;font-size:0.8125rem;font-weight:600;margin:0 0 0.375rem}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.ib{width:44px;height:44px;margin:-0.5rem -0.375rem;display:inline-grid;place-items:center;border:0;border-radius:50%;background:none;color:var(--muted);cursor:pointer;flex:none}
.ib:hover,.ib[aria-expanded=true]{color:var(--accent)}
h2 .ib,h3 .ib,.small .ib{vertical-align:middle;margin:-0.75rem -0.375rem -0.625rem -0.25rem}
.notice .ib{margin:-0.6875rem -0.5rem -0.6875rem auto;color:inherit}
.pop{position:fixed;z-index:90;width:min(300px,calc(100vw - 16px));padding:0.75rem 0.875rem 0.125rem;border-radius:12px;background:var(--surface);color:var(--text);border:1px solid var(--line);box-shadow:var(--shadow);font-size:0.875rem;font-weight:400;line-height:1.45;text-align:left;letter-spacing:0;white-space:normal}
.pop>span{display:block}
.pop.nolink{padding-bottom:0.75rem}
.pop a{display:inline-flex;align-items:center;min-height:44px;color:var(--accent);font-weight:600;text-decoration:none}
.pop a:hover{text-decoration:underline}
.lrow{display:flex;align-items:center;gap:0.125rem;min-height:44px}
.lrow .lbl{margin:0}

/* ---------- Header ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:0.5rem;height:64px}
.brand{display:flex;align-items:center;min-height:44px;gap:0.75rem;font-weight:700;font-size:1.0625rem;color:inherit;text-decoration:none;margin-right:auto;letter-spacing:-.01em;min-width:0;white-space:nowrap}
.brand svg{width:36px;height:36px;flex:none}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:0.9375rem;text-transform:uppercase;flex:none}
#navSettings{border-radius:12px;background:var(--hover);color:var(--text)}
#navSettings:hover{filter:brightness(.96)}
.notice{display:flex;gap:0.625rem;align-items:flex-start;padding:0.75rem 0.875rem;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);margin:0.25rem 0 0.75rem;font-size:0.875rem}
.notice.info{background:var(--accent-soft);color:var(--text)}
.notice.info svg,.notice.info .spin{color:var(--accent)}
.notice .spin{margin-top:0.1875rem}

/* ---------- Sign-in and forced password change ---------- */
.authv .top,.authv #app{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:calc(1.5rem + env(safe-area-inset-top)) max(1rem,env(safe-area-inset-right)) calc(1.5rem + env(safe-area-inset-bottom)) max(1rem,env(safe-area-inset-left))}
.card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:1.75rem 1.5rem 1.125rem;display:grid;gap:0.875rem}
.card .logo{width:48px;height:48px}
.card .notice{margin:0}
.card .btn{width:100%;margin-top:0.25rem}
.card .linkbtn{justify-self:center}
.card .small{text-align:center}

/* ---------- Mode card and encryption card ---------- */
.status{display:flex;flex-wrap:wrap;align-items:center;gap:0.75rem 1.5rem;padding:0.875rem;margin:0.125rem 0 0.625rem}
.seg2{position:relative;isolation:isolate;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0.25rem;padding:0.25rem;border-radius:12px;background:var(--hover)}
.seg2::before{content:"";position:absolute;z-index:-1;top:4px;bottom:4px;left:4px;width:calc(50% - 6px);border-radius:9px;background:var(--accent);opacity:0;transition:transform .34s cubic-bezier(.3,1.2,.5,1),opacity .2s var(--ease)}
.seg2[data-on]::before{opacity:1}
.seg2[data-on=usb]::before{transform:translateX(calc(100% + 4px))}
.seg2 button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;min-height:44px;padding:0 1rem;border:0;border-radius:9px;background:none;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
.seg2[data-on=app] #segApp,.seg2[data-on=usb] #segUsb{color:var(--on-accent)}
.seg2:not([data-on=app]) #segApp:not(:disabled):hover,.seg2:not([data-on=usb]) #segUsb:not(:disabled):hover{color:var(--text)}
.seg2 button:disabled{cursor:default}
.seg2 button:disabled:not([aria-pressed=true]){opacity:.6}
.mstat{display:flex;align-items:center;gap:0.625rem;min-width:0;flex:1 1 auto;font-size:0.875rem;font-weight:550}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.mode-app .dot,.netrow .dot{background:var(--accent)}
.mode-usb .dot{background:var(--usb)}
.mode-lock .dot{background:var(--warn)}
.mode-err .dot{background:var(--danger)}
.sto{flex:0 0 180px;font-size:0.8125rem;color:var(--muted);text-align:right;white-space:nowrap}
#stoSub:not(:empty)::before{content:" · "}
.bar{display:block;height:6px;border-radius:3px;background:var(--hover);overflow:hidden;margin-top:0.5rem}
.bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px}
.bar.high>i{background:var(--warn)}
.bar.full>i{background:var(--danger)}
.sto .bar{height:4px;margin-top:0.375rem}
.enc{display:flex;flex-wrap:wrap;align-items:center;gap:0.625rem 0.875rem;padding:0.75rem 0.875rem;margin-bottom:1.625rem}
.tile{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.enc.off .tile{background:var(--warn-soft);color:var(--warn)}
.enc.dmg .tile{background:var(--danger-soft);color:var(--danger)}
.enc .txt{min-width:0;line-height:1.35}
#encTitle{display:block;font-size:0.875rem;font-weight:650}
#encSub{display:block;font-size:0.8125rem;color:var(--accent)}
.enc.off #encSub{color:var(--warn)}
.enc.dmg #encSub{color:var(--danger)}
.enc .act{margin-left:auto;display:flex}
.enc .btn{min-height:44px;padding:0 0.875rem;font-size:0.875rem}

/* ---------- Breadcrumb, toolbar, selection and clipboard bars ---------- */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;margin:-0.375rem 0 0.125rem -0.375rem;font-size:0.875rem;color:var(--muted);min-width:0}
.cr{display:inline-flex;align-items:center;min-width:0;max-width:100%}
.cr+.cr::before{content:"›";padding:0 0.0625rem;flex:none}
.crumbs a,.crumbs .ell,.crumbs [aria-current]{color:inherit;text-decoration:none;font-weight:600;padding:0.5625rem 0.375rem;border-radius:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.crumbs a:hover,.crumbs .ell:hover{color:var(--text);background:var(--hover)}
.crumbs [aria-current]{color:var(--text)}
.crumbs .ell{border:0;background:none;cursor:pointer;font:inherit;font-weight:700;min-width:32px}
.cr.ellc{display:none}
.toolbar{display:flex;align-items:center;gap:0.625rem;margin-bottom:0.75rem;flex-wrap:wrap}
.toolbar h1{margin-right:auto;min-width:0;overflow-wrap:anywhere}
.count{font-size:0.8125rem;color:var(--muted);font-weight:400;margin-left:0.375rem;letter-spacing:0}
.search{position:relative;flex:0 1 262px}
.search svg{position:absolute;left:12px;top:12px;color:var(--muted);pointer-events:none}
.search input{padding-left:2.5rem}
.sortw{display:none;position:relative;width:44px;height:44px;flex:none;place-items:center;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--muted)}
.sortw select{position:absolute;top:-1px;left:-1px;width:44px;height:44px;opacity:0;cursor:pointer}
.bars{position:sticky;top:var(--top);z-index:15;background:var(--bg)}
.selbar{display:flex;flex-wrap:wrap;align-items:center;gap:0.25rem;min-height:56px;padding:0.375rem;margin-bottom:0.625rem;border-radius:var(--r-lg);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--accent-soft)}
.selbar strong{margin-right:auto;padding:0 0.375rem 0 0.125rem}
.sacts{display:flex;gap:0.125rem;flex-wrap:wrap}
.sb{display:inline-flex;align-items:center;justify-content:center;gap:0.4375rem;min-height:44px;min-width:44px;padding:0 0.75rem;border:0;border-radius:var(--r);background:none;color:var(--text);font-weight:600;font-size:0.875rem;cursor:pointer;white-space:nowrap}
.sb:hover{background:var(--hover)}
.sb.danger{color:var(--danger)}
.sb:disabled{opacity:.4;cursor:default;background:none}
.clipbar{display:flex;flex-wrap:wrap;align-items:center;gap:0.5rem 0.625rem;padding:0.5rem 0.5rem 0.5rem 0.875rem;margin-bottom:0.625rem;border-radius:var(--r-lg);background:var(--accent-soft)}
.clipbar>svg{color:var(--accent)}
.clipbar>span{flex:1 1 150px;min-width:0;font-weight:600;overflow-wrap:anywhere}
.clipbar .btn{min-height:44px;padding:0 0.875rem}
.clipbar .btn:not(.primary){background:none}

/* ---------- Files ---------- */
.cols,.row{display:grid;grid-template-columns:38px minmax(0,1fr) 120px 150px 44px;gap:0.875rem;align-items:center}
.cols{padding:0.5rem 0.5rem 0.5rem 0.75rem;font-size:0.8125rem;color:var(--muted);border-bottom:1px solid var(--line)}
.cols .lead{height:28px}
.cols button{background:none;border:0;padding:0.25rem 0;cursor:pointer;color:inherit;font-weight:500;display:inline-flex;gap:0.25rem;align-items:center;text-align:left}
.cols button svg{width:14px;height:14px}
.cols button.on{color:var(--text)}
.row{padding:0.625rem 0.5rem 0.625rem 0.75rem;border-bottom:1px solid var(--line);cursor:pointer;min-height:64px}
.row.open{background:var(--surface)}
.row.sel,.row.sel:hover{background:var(--accent-soft)}
.row .name{display:flex;font-weight:600;min-width:0;color:inherit;text-decoration:none}
.name .nb{overflow:hidden;text-overflow:ellipsis;white-space:pre}
.name .ne{flex:none;white-space:pre}
.row .meta{display:none;font-size:0.8125rem;color:var(--muted)}
.row .num,.row .date{font-size:0.875rem;color:var(--muted);white-space:nowrap}
.lead{position:relative;width:38px;height:38px}
.ck{position:absolute;inset:0;width:100%;height:100%;margin:0;-webkit-appearance:none;appearance:none;border-radius:10px;background:var(--hover);cursor:pointer;opacity:0;display:grid;place-items:center}
.row.sel .ck{background:transparent}
.ck::before,.ck::after{content:"";grid-area:1/1}
.ck::before{width:20px;height:20px;border-radius:6px;box-shadow:inset 0 0 0 2px var(--muted)}
.ck:checked::before,.ck:indeterminate::before{background:var(--accent);box-shadow:none}
.ck::after{width:5px;height:10px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg);opacity:0}
.ck:checked::after{opacity:1}
.ck:indeterminate::after{opacity:1;width:10px;height:0;border-width:0 0 2.5px;transform:none}
.selmode .ck,.ck:checked,.ck:focus-visible{opacity:1}
@media (hover:hover){.row:hover{background:var(--surface)}a.name:hover .nb{text-decoration:underline}.row:hover .ck,.cols:hover .ck{opacity:1}}
@media (hover:none){.ck{pointer-events:none}.selmode .ck{pointer-events:auto}.row{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}}
.ficon{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:0.625rem;font-weight:750;letter-spacing:.02em;background:var(--hover);color:var(--muted)}
.ficon.dir,.ficon.model{color:var(--accent);background:var(--accent-soft)}
.ficon.image{color:#9c2a6e;background:color-mix(in srgb,#9c2a6e 13%,transparent)}
.ficon.doc{color:#2857ab;background:color-mix(in srgb,#2857ab 13%,transparent)}
.ficon.archive{color:var(--warn);background:var(--warn-soft)}
.ficon.media{color:var(--usb);background:var(--usb-soft)}
:root[data-theme=dark] .ficon.image{color:#f08cc4}:root[data-theme=dark] .ficon.doc{color:#8db4f5}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .ficon.image{color:#f08cc4}:root:not([data-theme=light]) .ficon.doc{color:#8db4f5}}
.ficon.long{font-size:0.5312rem}
.ficon svg{width:18px;height:18px}
.ficon.dir svg{width:21px;height:21px;fill:currentColor;fill-opacity:.2}
.state{text-align:center;padding:3.5rem 1rem 2.5rem;color:var(--muted)}
.state .big,.ucard .big{width:60px;height:60px;border-radius:18px;background:var(--surface);display:grid;place-items:center;margin:0 auto 1.125rem;color:var(--muted)}
.state .big svg,.ucard .big svg{width:26px;height:26px}
.state h2{color:var(--text);margin-bottom:0.375rem;font-size:1.125rem}
.state p{max-width:460px;margin:0 auto 1.25rem}
.state .acts{display:flex;gap:0.625rem;justify-content:center;flex-wrap:wrap}
.hint{font-size:0.8125rem;color:var(--muted);padding:0.875rem 0.625rem 0}
.skel{height:60px;border-radius:var(--r);background:var(--surface);animation:sk 1.4s ease-in-out infinite;margin-bottom:0.375rem}
@keyframes sk{50%{opacity:.45}}
.list{padding-bottom:calc(var(--ph,0) + 3rem)}

/* ---------- Menu / sheet ---------- */
.scrim{position:fixed;inset:0;z-index:40}
.menu{position:fixed;z-index:41;min-width:220px;max-width:calc(100vw - 16px);background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:0.375rem}
.menu .mhead{display:none}
.menu .mhead.uhead{display:block;padding:0.5rem 0.75rem 0.625rem;margin-bottom:0.25rem;border-bottom:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mhead small{display:block;color:var(--muted);font-size:0.8125rem;font-weight:400}
.menu button{display:flex;align-items:center;gap:0.75rem;width:100%;min-height:44px;padding:0 0.75rem;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--hover)}
.menu button.danger{color:var(--danger)}

/* ---------- Busy overlay (copying blocks the device) ---------- */
.busy{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:1rem;background:rgba(10,12,14,.45)}
.busy>div{display:flex;gap:0.875rem;align-items:flex-start;max-width:420px;padding:1.25rem 1.375rem;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow)}
.busy .spin{width:22px;height:22px;color:var(--accent)}
.busy strong{display:block;overflow-wrap:anywhere}
.busy p{color:var(--muted);font-size:0.875rem;margin-top:0.25rem}

/* ---------- Uploads panel ---------- */
.uploads{position:fixed;right:20px;bottom:20px;z-index:30;width:380px;max-width:calc(100vw - 32px);background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.uploads header{display:flex;align-items:center;gap:0.5rem;padding:0.625rem 0.5rem 0.375rem 1rem;min-height:56px}
.uploads header strong{margin-right:auto}
.uploads ul{list-style:none;margin:0;padding:0 1rem 0.75rem;max-height:38vh;overflow:auto}
.uploads li{padding:0.5rem 0}
.uploads .l1{display:flex;gap:0.625rem;align-items:center;min-height:32px}
.uploads .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550}
.uploads .s{font-size:0.8125rem;color:var(--muted);white-space:nowrap}
.uploads .ok{color:var(--accent)}

  helpDoc: [
    ["betriebsart", "Betriebsart und Drucker", `<p>Auf das Laufwerk kann immer nur eine Seite zugreifen: die Dateiverwaltung im Browser oder das angeschlossene USB-Gerät, zum Beispiel ein Drucker. So gerät nichts durcheinander.</p>
<ol><li>Oben auf der Startseite „Dateiverwaltung“ wählen, um Dateien anzusehen, hochzuladen oder zu löschen. Das USB-Gerät sieht das Laufwerk dann nicht.</li><li>„USB-Gerät“ wählen, um das Laufwerk zurückzugeben.</li></ol>
<p>Startet ein Upload, während das USB-Gerät das Laufwerk hat, wechselt es von selbst. Mit „Nach dem Hochladen wieder bereitstellen“ (Einstellungen › Speicher & USB) bekommt das USB-Gerät es danach automatisch zurück. Diese Einstellung gilt für den jeweiligen Browser.</p>
<p>Verwendet das USB-Gerät das Laufwerk noch, fragt die Seite vor dem Wechsel nach – ein laufender Druck würde abbrechen. Sicherer ist es, das Laufwerk vorher am Gerät auszuwerfen.</p>
<p>„USB-Gerät darf Dateien ändern“: Ausgeschaltet kann das Gerät nur lesen – empfohlen für Drucker. Gilt ab dem nächsten Bereitstellen.</p>`],
    ["hochladen", "Hochladen und Ordner", `<ol><li>„Hochladen“ wählen und Dateien aussuchen. Am Computer lassen sich Dateien und ganze Ordner auch in das Fenster ziehen.</li><li>„Ordner hochladen“ im Menü von „Hochladen“ überträgt einen Ordner mit Unterordnern. Am iPhone gibt es das nicht.</li></ol>
<p>Höchstens 4 GB pro Datei. 3MF-Dateien werden beim Hochladen auf Vollständigkeit geprüft. Versteckte Systemdateien (Name beginnt mit einem Punkt) werden übersprungen.</p>
<p>Bricht ein Upload ab, dieselbe Datei noch einmal wählen: Er wird an der Stelle fortgesetzt. Wird zuerst etwas anderes hochgeladen, ist der Rest verworfen.</p>
<p>Ordner werden als ZIP heruntergeladen. Das geht nur, solange die Dateiverwaltung aktiv ist.</p>`],
    ["speicher", "Speicher und Formatieren", `<p>Kann das Laufwerk den Speicher nicht lesen, muss er formatiert werden: Einstellungen › Speicher & USB › Speicher formatieren. Das dürfen nur Administratoren.</p>
<p>Formatieren löscht alle Dateien unwiderruflich und richtet den Speicher neu ein. Zur Bestätigung wird das Wort LÖSCHEN eingetippt.</p>
<p>Ist die Verschlüsselung an, geht Formatieren erst nach dem Entsperren; sie bleibt danach eingeschaltet.</p>`],
    ["verschluesselung", "Verschlüsselung", `<p>Mit Verschlüsselung kann niemand die Dateien lesen, der die Speicherkarte entnimmt oder den Stick ohne Laufwerks-Passwort bekommt.</p>
<ul><li>Das Laufwerks-Passwort ist ein eigenes Passwort, nicht das Anmelde-Passwort. Das Zurücksetzen per Taste öffnet das Laufwerk nicht.</li><li>Nach jedem Einstecken und jedem Stromausfall ist das Laufwerk gesperrt. Bis es entsperrt ist, sieht auch der Drucker kein Laufwerk.</li><li>Der Speicher ist nur noch in diesem Stick lesbar.</li></ul>
<p><b>Einrichten</b> (Administrator): „Verschlüsselung einrichten“ auf der Startseite oder Einstellungen › Sicherheit.</p>
<ol><li>Ein Laufwerks-Passwort mit mindestens 12 Zeichen wählen – am besten einen Satz aus mehreren Wörtern.</li><li>LÖSCHEN eintippen. Alle Dateien werden gelöscht.</li><li>Den Wiederherstellungsschlüssel aufschreiben und getrennt vom Stick aufbewahren. Er wird nur einmal angezeigt.</li></ol>
<p><b>Passwort vergessen:</b></p>
<ol><li>Beim Entsperren „Stattdessen den Wiederherstellungsschlüssel verwenden“ wählen.</li><li>Danach unter Sicherheit › Verschlüsselung „Laufwerks-Passwort ändern“ wählen und als bisheriges Passwort den Wiederherstellungsschlüssel eingeben.</li></ol>
<p>Ist der Schlüssel verloren oder hat ihn jemand gesehen: „Neuen Wiederherstellungsschlüssel erzeugen“. Der alte gilt dann nicht mehr.</p>
<p>Ohne Passwort und Schlüssel – oder bei beschädigtem Schlüsselbereich – bleibt nur „Löschen und neu formatieren“. Alle Dateien gehen dabei verloren.</p>
<p>Nach drei falschen Eingaben muss gewartet werden. Jeder weitere Fehlversuch verdoppelt die Wartezeit (höchstens 5 Minuten); sie gilt für alle Geräte.</p>`],
    ["sperren", "Automatisch sperren", `<p>Sperrt das verschlüsselte Laufwerk nach der gewählten Zeit ohne Zugriff (Einstellungen › Speicher & USB). Wird der Stick abgezogen, ist es danach immer gesperrt.</p>
<p>„Sperren, wenn das USB-Gerät getrennt wird“ sperrt zusätzlich, sobald der Drucker oder PC das Laufwerk trennt.</p>
<p>Von Hand sperren: „Sperren“ in der Karte „Verschlüsselt“ auf der Startseite. Ein angeschlossenes Gerät verliert das Laufwerk sofort.</p>`],
    ["wlan", "WLAN und Einrichtung", `<p>Das Laufwerk verbindet sich mit dem stärksten gespeicherten WLAN in Reichweite. Bis zu 5 WLANs lassen sich speichern.</p>
<ol><li>Einstellungen › WLAN › „WLAN hinzufügen“.</li><li>Ein WLAN aus der Liste wählen oder den Namen von Hand eingeben (versteckte WLANs).</li><li>Das Passwort eingeben und speichern. Das Laufwerk verbindet sich neu; diese Seite ist kurz nicht erreichbar. Ob es geklappt hat, zeigt das Display.</li></ol>
<p>Ist ein WLAN schon gespeichert, wird sein Passwort ersetzt.</p>
<p><b>Einrichtungs-WLAN:</b> Findet das Laufwerk kein bekanntes WLAN, öffnet es ein eigenes, passwortgeschütztes WLAN. Das Passwort steht nur auf dem Display.</p>
<p><b>Anmeldefenster des Telefons:</b> Dort klappt nur die WLAN-Einrichtung. Für Dateien das Fenster schließen – am iPhone „Ohne Internet verwenden“ wählen – und im Browser http://192.168.4.1 öffnen.</p>`],
    ["netzlaufwerk", "Netzlaufwerk", `<p>Die Dateien lassen sich direkt im Explorer oder in einer Datei-App öffnen (WebDAV). Das geht nur, solange die Dateiverwaltung aktiv ist – nicht, während das Laufwerk dem USB-Gerät bereitgestellt ist. Die Adresse steht unter Einstellungen › WLAN.</p>
<p><b>Windows:</b></p><ol><li>Explorer › Dieser PC › „Netzlaufwerk verbinden“.</li><li>Die Adresse eintragen und mit Benutzername und Passwort anmelden.</li><li>Über http erlaubt Windows die Anmeldung mit Passwort erst nach einer einmaligen Einstellung. Dafür gibt es im Projekt das Skript unter tools/webdav.</li></ol>
<p><b>Handy:</b> Eine Datei-App mit WebDAV verwenden und dort die Adresse eintragen. Die App „Dateien“ des iPhones kann kein WebDAV.</p>`],
    ["https", "HTTPS und Zertifikat", `<p>Mit HTTPS gehen Passwörter und Dateien nicht mehr lesbar durchs WLAN. Ohne HTTPS werden auch die Anmeldedaten unverschlüsselt übertragen – dann das Laufwerk nur in vertrauenswürdigen Netzwerken verwenden.</p>
<ul><li>Ein- und Ausschalten gilt nach einem Neustart.</li><li>Jeder Browser warnt beim ersten Aufruf, weil der Stick sein eigenes Zertifikat ausstellt. Die Warnung verschwindet, sobald das Zertifikat des Sticks installiert ist.</li><li>Die Adresse beginnt dann mit https://. Ein Symbol auf dem Home-Bildschirm muss neu angelegt werden.</li><li>Skripte mit http:// (zum Beispiel „Senden an“ oder ein Kurzbefehl) müssen auf https:// umgestellt werden.</li></ul>
<p><b>Zertifikat installieren</b> (einmal auf jedem Gerät): „Zertifikat herunterladen“ unter Einstellungen › Sicherheit.</p>
<p><b>iPhone:</b></p><ol><li>In Safari herunterladen.</li><li>Einstellungen › Profil geladen › Installieren.</li><li>Allgemein › Info › Zertifikatsvertrauenseinstellungen: Vertrauen einschalten.</li></ol>
<p><b>Windows:</b></p><ol><li>Die Datei öffnen › Zertifikat installieren › Lokaler Computer.</li><li>Den Speicher „Vertrauenswürdige Stammzertifizierungsstellen“ wählen und fertigstellen.</li></ol>
<p>Die Fingerabdrücke lassen sich mit den Zertifikatsdetails im Browser vergleichen. „Zertifikat erneuern“ stellt ein neues Server-Zertifikat aus, zum Beispiel nach einem WLAN-Wechsel; das installierte Zertifikat des Sticks bleibt gültig.</p>`],
    ["benutzer", "Benutzer und vertraute Geräte", `<p>Administratoren dürfen alles, Benutzer verwalten nur Dateien. Bis zu 8 Konten sind möglich. Der letzte Administrator kann weder gelöscht noch herabgestuft werden.</p>
<p><b>Vertraute Geräte</b> bleiben angemeldet, auch nach einem Neustart des Laufwerks – bis sie unter Einstellungen › Sicherheit entfernt werden, sich dort abmelden oder das Passwort geändert wird. Dafür beim Anmelden „Diesem Gerät vertrauen“ wählen.</p>
<p>Wird ein Passwort geändert, werden die anderen Geräte dieses Kontos abgemeldet.</p>`],
    ["uhrzeit", "Uhrzeit", `<p>Das Laufwerk holt die Uhrzeit aus dem Netz. Ohne Internet stellt sie der Browser, sobald diese Seite geöffnet wird.</p>
<p>Die Zeitzone (Einstellungen › System) gilt für die Zeitangaben der Dateien und für das Display.</p>`],
    ["update", "Update und Wartung", `<ol><li>Einstellungen › System › „Datei auswählen …“.</li><li>Die Datei printdrive.bin der neuen Version wählen und bestätigen.</li><li>Das Laufwerk startet neu. Alle müssen sich danach neu anmelden.</li></ol>
<p>Die neue Version läuft zuerst zur Probe. Läuft sie nicht stabil, kehrt das Laufwerk von selbst zur bisherigen zurück.</p>
<p><b>Protokoll:</b> hilft bei der Fehlersuche. <b>Neu starten:</b> dauert etwa 10 Sekunden; ein angeschlossenes USB-Gerät verliert das Laufwerk kurz.</p>
<p><b>Wartungsmodus:</b> startet das Laufwerk so, dass neue Gerätesoftware per USB-Kabel aufgespielt werden kann. Diese Seite ist danach nicht erreichbar, bis das Laufwerk aus- und wieder eingesteckt wird.</p>`],
    ["stick", "Taste und Display am Stick", `<p><b>Anmelde-Passwort vergessen:</b> Die Taste am Laufwerk 10 Sekunden lang halten. Danach gilt wieder admin / admin; die Dateien bleiben erhalten. Ein verschlüsseltes Laufwerk wird dadurch nicht geöffnet.</p>
<p>Das Display zeigt die Adresse des Laufwerks, ob die WLAN-Verbindung geklappt hat, und im Einrichtungs-WLAN dessen Passwort. Die gewählte Sprache der Seite gilt auch für das Display.</p>`]
  ],

  helpDoc: [
    ["betriebsart", "Mode and printer", `<p>Only one side can use the drive at a time: file management in the browser, or the connected USB device such as a printer. That keeps everything consistent.</p>
<ol><li>Choose “File management” at the top of the start page to view, upload or delete files. The USB device can’t see the drive meanwhile.</li><li>Choose “USB device” to hand the drive back.</li></ol>
<p>If an upload starts while the USB device has the drive, it switches by itself. With “Hand back after uploading” (Settings › Storage & USB) the USB device gets it back automatically afterwards. This setting applies to each browser separately.</p>
<p>If the USB device is still using the drive, the page asks before switching — a running print would stop. It’s safer to eject the drive on the device first.</p>
<p>“USB device may change files”: when off, the device can only read — recommended for printers. Takes effect the next time the drive is handed over.</p>`],
    ["hochladen", "Uploading and folders", `<ol><li>Choose “Upload” and pick files. On a computer you can also drag files and whole folders into the window.</li><li>“Upload folder” in the “Upload” menu transfers a folder with its subfolders. Not available on iPhone.</li></ol>
<p>At most 4 GB per file. 3MF files are checked for completeness when uploaded. Hidden system files (name starts with a dot) are skipped.</p>
<p>If an upload stops, choose the same file again and it resumes where it stopped. Uploading something else first discards the part already sent.</p>
<p>Folders download as a ZIP. This only works while file management is active.</p>`],
    ["speicher", "Storage and formatting", `<p>If the drive can’t read its storage, it has to be formatted: Settings › Storage & USB › Format storage. Only administrators can do this.</p>
<p>Formatting erases every file for good and sets up the storage again. To confirm, type the word ERASE.</p>
<p>With encryption on, formatting is possible only after unlocking; encryption stays on afterwards.</p>`],
    ["verschluesselung", "Encryption", `<p>With encryption, nobody can read the files by removing the memory card or by getting hold of the stick without the drive password.</p>
<ul><li>The drive password is a separate password, not your sign-in password. Resetting with the button does not open the drive.</li><li>The drive is locked every time it is plugged in or loses power. Until it is unlocked, the printer sees no drive either.</li><li>The storage can be read only in this stick.</li></ul>
<p><b>Set up</b> (administrator): “Set up encryption” on the start page, or Settings › Security.</p>
<ol><li>Choose a drive password of at least 12 characters — best a sentence of several words.</li><li>Type ERASE. All files are erased.</li><li>Write down the recovery key and keep it apart from the stick. It is shown only once.</li></ol>
<p><b>Forgot the password:</b></p>
<ol><li>When unlocking, choose “Use the recovery key instead”.</li><li>Then choose “Change drive password” under Security › Encryption and enter the recovery key as the current password.</li></ol>
<p>If the key is lost or someone has seen it: “Create a new recovery key”. The old one stops working.</p>
<p>Without password and key — or with a damaged key area — only “Erase and reformat” is left. All files are lost.</p>
<p>After three wrong entries you have to wait. Each further wrong entry doubles the wait (at most 5 minutes); it applies to all devices.</p>`],
    ["sperren", "Automatic lock", `<p>Locks the encrypted drive after the chosen time without access (Settings › Storage & USB). Once the stick is unplugged, it is always locked.</p>
<p>“Lock when the USB device is disconnected” also locks as soon as the printer or computer releases the drive.</p>
<p>To lock by hand: “Lock” in the “Encrypted” card on the start page. A connected device loses the drive at once.</p>`],
    ["wlan", "Wi-Fi and setup", `<p>The drive connects to the strongest saved network in range. Up to 5 networks can be saved.</p>
<ol><li>Settings › Wi-Fi › “Add network”.</li><li>Pick a network from the list or type its name (hidden networks).</li><li>Enter the password and save. The drive reconnects; this page is unreachable for a moment. The display shows whether it worked.</li></ol>
<p>If a network is already saved, its password is replaced.</p>
<p><b>Setup network:</b> if the drive finds no known network, it opens its own password-protected network. The password is shown only on the display.</p>
<p><b>Phone sign-in window:</b> only the Wi-Fi setup works there. For files, close it (on iPhone choose “Use Without Internet”) and open http://192.168.4.1 in the browser.</p>`],
    ["netzlaufwerk", "Network drive", `<p>The files can be opened directly in Explorer or a file app (WebDAV). This works only while file management is active — not while the drive is provided to the USB device. The address is under Settings › Wi-Fi.</p>
<p><b>Windows:</b></p><ol><li>Explorer › This PC › “Map network drive”.</li><li>Enter the address and sign in with user name and password.</li><li>Over http, Windows allows password sign-in only after a one-time setting. The project has a script for it under tools/webdav.</li></ol>
<p><b>Phone:</b> use a file app with WebDAV and enter the address there. The iPhone’s own “Files” app can’t do WebDAV.</p>`],
    ["https", "HTTPS and certificate", `<p>With HTTPS, passwords and files no longer travel readable over Wi-Fi. Without HTTPS the sign-in details travel unencrypted too — then use the drive only on networks you trust.</p>
<ul><li>Turning it on or off takes effect after a restart.</li><li>Every browser warns on the first visit, because the stick issues its own certificate. The warning goes away once the stick’s certificate is installed.</li><li>The address then starts with https://. A home-screen icon has to be added again.</li><li>Scripts using http:// (for example “Send to” or a shortcut) have to be switched to https://.</li></ul>
<p><b>Install the certificate</b> (once on every device): “Download certificate” under Settings › Security.</p>
<p><b>iPhone:</b></p><ol><li>Download it in Safari.</li><li>Settings › Profile Downloaded › Install.</li><li>General › About › Certificate Trust Settings: turn on trust.</li></ol>
<p><b>Windows:</b></p><ol><li>Open the file › Install Certificate › Local Machine.</li><li>Choose the store “Trusted Root Certification Authorities” and finish.</li></ol>
<p>The fingerprints can be compared with the certificate details in the browser. “Renew certificate” issues a new server certificate, for example after changing the Wi-Fi network; the stick’s installed certificate stays valid.</p>`],
    ["benutzer", "Users and trusted devices", `<p>Administrators can do everything, users can only manage files. Up to 8 accounts are possible. The last administrator can neither be deleted nor demoted.</p>
<p><b>Trusted devices</b> stay signed in, even after the drive restarts — until they are removed under Settings › Security, sign out there, or the password is changed. Choose “Trust this device” when signing in.</p>
<p>When a password is changed, the account’s other devices are signed out.</p>`],
    ["uhrzeit", "Clock", `<p>The drive takes the time from the network. Without internet, the browser sets it as soon as this page is opened.</p>
<p>The time zone (Settings › System) applies to the file times and to the display.</p>`],
    ["update", "Update and maintenance", `<ol><li>Settings › System › “Choose file …”.</li><li>Choose the printdrive.bin file of the new version and confirm.</li><li>The drive restarts. Everybody has to sign in again.</li></ol>
<p>The new version first runs on trial. If it doesn’t run stable, the drive returns to the previous one by itself.</p>
<p><b>Log:</b> helps with troubleshooting. <b>Restart:</b> takes about 10 seconds; a connected USB device loses the drive briefly.</p>
<p><b>Maintenance mode:</b> starts the drive so that new firmware can be flashed over the USB cable. This page is unreachable afterwards until the drive is unplugged and plugged back in.</p>`],
    ["stick", "Button and display on the stick", `<p><b>Forgot the sign-in password:</b> hold the button on the drive for 10 seconds. The sign-in is then admin / admin again; your files are kept. An encrypted drive is not opened by this.</p>
<p>The display shows the drive’s address, whether the Wi-Fi connection worked, and in the setup network its password. The language chosen on this page also applies to the display.</p>`]

/* ---------- preferences (per browser) ---------- */
const pref = {
  get(k, d){ try { const v = localStorage.getItem("dd-" + k); return v === null ? d : v; } catch(e) { return d; } },
  set(k, v){ try { v === "" ? localStorage.removeItem("dd-" + k) : localStorage.setItem("dd-" + k, v); } catch(e) {} }
};
function applyTheme(){ const th = pref.get("theme", ""); if (th) document.documentElement.dataset.theme = th; else delete document.documentElement.dataset.theme; }
applyTheme();

function errText(r, ctx){
  const E = L[lang].E, v = (ctx && E[ctx + "." + r.code]) || E[r.code];
  return typeof v === "function" ? v(r) : v || r.error || E.HTTP({status: "?"});

function setLang(l){
  lang = l === "en" ? "en" : "de";
  const nl = navigator.language || "";
  loc = lang === "de" ? "de-DE" : /^en/i.test(nl) ? nl : "en-GB";
  document.documentElement.lang = lang;

  TF = new Intl.DateTimeFormat(loc, {hour: "2-digit", minute: "2-digit"});
  DF = new Intl.DateTimeFormat(loc, lang === "de" ? {day: "2-digit", month: "2-digit", year: "numeric"} : {day: "numeric", month: "short", year: "numeric"});

  $$("[data-tt]").forEach(e => { e.setAttribute("aria-label", t(e.dataset.tt)); e.title = t(e.dataset.tt); });
  $$("[data-tp]").forEach(e => e.placeholder = t(e.dataset.tp));
  $$("[data-lang]").forEach(e => { e.textContent = t("otherLang"); e.lang = lang === "de" ? "en" : "de"; });
}
function fsize(b){ const u = ["B","kB","MB","GB","TB"]; let i = 0; while (b >= 1024 && i < 4) { b /= 1024; i++; } return nf.format(b) + " " + u[i]; }
function fdate(s){
  if (!s) return "–";
  const d = new Date(s * 1000), day = x => Math.floor((x - x.getTimezoneOffset() * 6e4) / 864e5), diff = day(new Date()) - day(d);
  if (diff === 0) return t("today") + ", " + TF.format(d);
  if (diff === 1) return t("yesterday") + ", " + TF.format(d);

}
const secs = ms => Math.floor(ms / 1000);

const CATS = {model: "3mf stl obj step stp gcode amf", image: "jpg jpeg png gif webp svg bmp heic", doc: "pdf txt md doc docx odt xls xlsx csv ppt pptx", archive: "zip 7z rar gz tar", media: "mp3 wav flac m4a mp4 mov mkv avi"};

  const m = /\.([^.]+)$/.exec(name), ext = m ? m[1].toLowerCase() : "";
  const cat = Object.keys(CATS).find(c => CATS[c].split(" ").includes(ext)) || "";

/* ---------- State ---------- */

  me: null,            // {user, role, def}
  why: "",             // reason shown on the sign-in view
  st: null,            // last status from the device
  dir: "",             // current folder, "" = main directory (mirrors the URL hash "#/a/b")
  entries: null,       // entries of the current folder; null = not loaded
  filesVer: 0, trunc: false,
  listKey: "",         // change detector for reloading the folder

/* ---------- Server access. Every answer can be 401 (signed out) or 403 (role, forced password change); api() reacts to those centrally. ---------- */
async function api(path, o = {}){
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), o.timeout || 20000);
  const init = {method: o.method || "GET", cache: "no-store", credentials: "same-origin", signal: ctl.signal, headers: {}};
  if (init.method === "POST") init.headers["X-PrintDrive"] = "1";
  if (o.body !== undefined) { init.body = o.body; init.headers["Content-Type"] = "application/x-www-form-urlencoded"; }
  let j = null;
  try {
    const r = await fetch(path, init);
    if (o.text && r.ok) return await r.text();
    try { j = await r.json(); } catch(e) {}
    if (!j) j = {ok: false, code: "HTTP", status: r.status};
    const ra = parseInt(r.headers.get("Retry-After"), 10);   // lock-outs: seconds until the next try
    if (ra > 0) j.retry = ra; else if (j.retry_after > 0) j.retry = Math.ceil(j.retry_after);
  } catch(e) {
    j = {ok: false, code: "OFFLINE"};
  } finally { clearTimeout(timer); }
  if (!j.ok && !o.auth) authFail(j);
  return o.text ? null : j;
}
const post = (path, o = {}) => api(path, Object.assign({method: "POST"}, o));
function authFail(j){
  if (j.code === "UNAUTHORIZED") lost();
  else if (j.code === "MUST_CHANGE_PASSWORD" && S.auth === "ok") { S.auth = "pw"; leaveApp(t("upPw")); if (S.me) S.me.def = true; showPw(); }
  else if (j.code === "FORBIDDEN_ROLE") recheck();
  else if (j.code === "DRIVE_LOCKED") driveLocked();
  else if (j.code === "CRYPT_DAMAGED") driveDamaged();
  else if (j.code === "AUTH_UNAVAILABLE" && S.auth === "ok") { S.auth = "login"; leaveApp(t("upOut")); showLogin("unavail"); bootTimer = setTimeout(boot, 5000); }
}

/* ---------- Toasts, dialogs, menus, busy overlay ---------- */
function toast(text, err){
  Array.from($("#toasts").children).filter(x => x.textContent === text).forEach(x => x.remove());   // same message again: replace, do not stack
  const el = document.createElement("div");
  el.className = "toast" + (err ? " err" : ""); el.setAttribute("role", err ? "alert" : "status"); el.textContent = text;
  $("#toasts").appendChild(el);
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 300); }, err ? 8000 : 4500);
}
/* ask({title, text|html, yes, no, danger, input|fields, run})
   fields: [{label, type ("text"|"password"|"check"), value, placeholder, options:[[v,l]], auto, max, raw, select}]
   Resolves false (cancelled), true (no fields), the value (input) or the list of values (fields).
   run(value) may return an error string: the dialog then stays open and shows it.
   o.out receives the field values also when the dialog was cancelled. */
let dlgQueue = Promise.resolve(), dlgCancel = null;
function ask(o){            // dialogs share one element: show them strictly one after another
  const p = dlgQueue.then(() => askNow(o));
  dlgQueue = p.catch(() => {});
  return p;
}
function askNow(o){
  return new Promise(resolve => {
    if (S.auth !== "ok") return resolve(false);          // signed out meanwhile: drop queued questions
    const d = $("#dlg"), yes = $("#dYes"), no = $("#dNo"), fields = o.fields || (o.input ? [o.input] : []);
    dlgProg("");
    $("#dTitle").textContent = o.title;
    popClose(); const di = $("#dInfo"); di.hidden = !o.info;            // info: [text, help topic]; no way out of a "must" dialog
    if (o.info) { di.dataset.x = o.info[0]; di.dataset.h = o.must ? "" : o.info[1] || ""; }
    $("#dBody").innerHTML = o.html || (o.text ? `<p>${esc(o.text)}</p>` : "");
    $("#dErr").textContent = "";
    $("#dFields").innerHTML = fields.map((f, i) => f.type === "check"
      ? `<label class="chk"><input type="checkbox" id="dF${i}"> ${esc(f.label)}</label>`
      : `<div><label class="lbl" for="dF${i}">${esc(f.label)}</label>${f.options
        ? `<select class="field" id="dF${i}">${opts(f.options, f.value)}</select>`
        : `<input class="field" id="dF${i}" type="${f.type || "text"}" autocomplete="${f.auto || "off"}" spellcheck="false" autocapitalize="none"${f.max ? ` maxlength="${f.max}"` : ""}>`}</div>`).join("");
    const els = fields.map((f, i) => { const el = $("#dF" + i); if (el.tagName === "INPUT" && f.type !== "check") { el.value = f.value || ""; el.placeholder = f.placeholder || ""; } return el; });
    const vals = () => fields.map((f, i) => f.type === "check" ? els[i].checked : f.type === "password" || f.raw || f.options ? els[i].value : els[i].value.trim());
    yes.textContent = o.yes || t("ok"); yes.className = "btn " + (o.danger ? "danger" : "primary"); yes.disabled = false;
    no.textContent = o.no || t("cancel"); no.disabled = false; no.hidden = !!(o.must || o.one);   // must: only the main button closes it
    let done = false, running = false;
    const finish = v => { if (done) return; done = true; dlgCancel = null; popClose(); if (d.open) d.close(); resolve(v); };
    const cancel = () => { if (!running && !o.must) { o.out = vals(); finish(false); } };
    dlgCancel = () => { running = false; finish(false); };
    $("#dForm").onsubmit = async e => {
      e.preventDefault();
      if (running) return;
      const v = vals(), val = !fields.length ? true : o.input ? v[0] : v;
      if (o.run) {
        running = true; yes.disabled = no.disabled = true; $("#dErr").textContent = "";
        if (o.wait) yes.innerHTML = `<span class="spin"></span>${esc(o.wait)}`;   // long requests: say that it works
        const err = await o.run(val);
        if (done) return;                    // signed out while waiting
        running = false; yes.disabled = no.disabled = false;
        if (o.wait) yes.textContent = o.yes;
        if (!d.open) {                       // the browser closed the dialog while we waited
          if (err) toast(err, true);
          return finish(err ? false : val);
        }
        if (err) { $("#dErr").textContent = err; return; }
      }
      o.out = v; finish(val);
    };
    no.onclick = cancel;
    d.oncancel = e => { e.preventDefault(); cancel(); };
    d.onclick = e => { if (e.target === d) cancel(); };
    d.onclose = () => { if (!d.open) cancel(); };   // a late close event of the previous dialog must not close this one
    d.showModal();
    const first = els[0];
    if (first && first.type !== "checkbox") { first.focus(); if (first.select) { if (fields[0].select) first.setSelectionRange(0, fields[0].select); else first.select(); } }
    else (o.danger ? no : yes).focus();
    if (o.init) o.init(els, yes);            // extra behaviour of one dialog (scan list, copy button …)
  });
}

const errBox = (title, text) => ask({title, text, must: true, yes: t("ok")});
/* Long request from an open dialog (erasing the card): the dialog shows a progress note instead of its content and stays
   blocking; status polling pauses (S.busy), so its missing answers do not count as "offline". */
let progTimer = 0;
function dlgProg(text){
  const on = !!text, t0 = Date.now();
  $("#dBody").hidden = $("#dFields").hidden = on; $("#dProg").hidden = !on;
  clearInterval(progTimer);
  if (!on) return;
  $("#dProgX").textContent = text;
  const tick = () => { $("#dProgT").textContent = t("running", Math.floor((Date.now() - t0) / 1000)); };
  tick(); progTimer = setInterval(tick, 1000);
}
async function longReq(path, body, text){
  S.busy = "crypt"; clearTimeout(pollTimer); dlgProg(text);
  try { return await post(path, {body: form(body), timeout: 900000}); }
  finally { S.busy = ""; S.fails = 0; dlgProg(""); schedule(1000); }
}

let menuFrom = null;
function closeMenu(refocus){
  const was = !$("#menu").hidden;
  $("#menu").hidden = $("#scrim").hidden = true;
  $$(".row.open").forEach(r => r.classList.remove("open"));
  if (refocus && was && menuFrom && menuFrom.isConnected) menuFrom.focus();
}
/* items: [[action, icon, label, danger]]; head is HTML (shown on phones, or always with uhead) */
function showMenu(from, ev, head, items, pick, row, uhead){
  const m = $("#menu");
  closeMenu(); if (row) row.classList.add("open"); menuFrom = from;
  m.innerHTML = `<div class="mhead${uhead ? " uhead" : ""}">${head}</div>` +
    items.map(([a, ic, l, dg]) => `<button role="menuitem" data-act="${a}"${dg ? ' class="danger"' : ""}>${icon(ic)}${esc(l)}</button>`).join("");
  m.hidden = $("#scrim").hidden = false;
  const r = ev && ev.clientX ? {left: ev.clientX, bottom: ev.clientY} : from.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(r.left, innerWidth - m.offsetWidth - 8)) + "px";
  m.style.top = Math.max(8, Math.min(r.bottom + 4, innerHeight - m.offsetHeight - 8)) + "px";
  m.style.transformOrigin = `${Math.max(0, r.left + (ev && ev.clientX ? 0 : from.offsetWidth / 2) - parseFloat(m.style.left))}px ${parseFloat(m.style.top) < r.bottom ? m.offsetHeight : 0}px`;   // grows out of its button
  m.onclick = async e => { const b = e.target.closest("[data-act]"); if (!b) return; closeMenu(); await pick(b.dataset.act); };
  m.onkeydown = e => {
    const list = Array.from(m.querySelectorAll("button")), i = list.indexOf(document.activeElement);
    const to = {ArrowDown: (i + 1) % list.length, ArrowUp: (i + list.length - 1) % list.length, Home: 0, End: list.length - 1}[e.key];
    if (to !== undefined) { e.preventDefault(); list[to].focus(); }
  };
  m.querySelector("button").focus();
}
$("#scrim").onclick = () => closeMenu(true);
addEventListener("resize", () => closeMenu());

// While a copy runs the device answers nothing else: block the page visibly.
function busyOn(title, text){
  $("#busyT").textContent = title; $("#busyX").textContent = text; $("#busy").hidden = false;
  $("#app").inert = $(".top").inert = true;
}

function blocked(){
  if (S.working) { toast(t("waitUpload")); return true; }
  if (S.busy) { toast(t("waitBusy")); return true; }

/* ---------- Sign-in, forced password change, session loss, account ---------- */
let bootTimer = 0, lockTimer = 0, rechecking = false;
async function boot(){
  clearTimeout(bootTimer);
  if (S.auth === "ok" || S.auth === "pw") return;
  const j = await api("/api/session", {auth: true, timeout: 8000});
  if (S.auth === "ok" || S.auth === "pw") return;
  if (j.ok) return signedIn(j);
  const why = j.code === "UNAUTHORIZED" ? (S.why === "offline" || S.why === "unavail" ? "" : S.why) : j.code === "AUTH_UNAVAILABLE" ? "unavail" : "offline";
  if (S.auth !== "login" || why !== S.why) showLogin(why, S.auth === "login");
  if (j.code !== "UNAUTHORIZED") bootTimer = setTimeout(boot, 3000);
}
function setMe(j){
  S.me = {user: j.user, role: j.role, def: !!j.default_password};
  document.body.classList.toggle("role-user", j.role !== "admin");
  $("#userAv").textContent = j.user.slice(0, 1);
  $("#userBtn").setAttribute("aria-label", t("acctL", j.user)); $("#userBtn").title = j.user;
}
function signedIn(j){
  clearTimeout(bootTimer);
  setMe(j);
  if (S.me.def) return showPw();
  S.auth = "ok"; S.why = ""; S.fails = 0; langSynced = false;
  $("#vLogin").hidden = $("#vPw").hidden = true;
  document.body.classList.remove("authv");
  S.listKey = ""; S.entries = null; listSig = "";
  route();
  schedule(0);
}
function renderWhy(){
  const n = $("#loginNote"), w = S.why;
  n.textContent = w ? t("why_" + w) : ""; n.hidden = !w; n.className = "notice" + (w === "offline" || w === "unavail" ? "" : " info");
  popSafe($("#cpLogin")); $("#cpLogin").innerHTML = `<span>${esc(t("cpS"))}</span>${ibH("cpX", "wlan")}`; $("#cpLogin").hidden = !CAPTIVE;
}
function showLogin(why, keepFocus){
  S.auth = "login"; S.why = why || ""; S.me = null;
  document.body.classList.add("authv"); document.body.classList.remove("role-user");
  $("#vPw").hidden = true; $("#vLogin").hidden = false;
  renderWhy();
  if (!keepFocus) { loginMsg(""); ($("#lUser").value ? $("#lPass") : $("#lUser")).focus(); }
}
function showPw(){
  S.auth = "pw";
  document.body.classList.add("authv");
  $("#vLogin").hidden = true; $("#vPw").hidden = false;
  $("#pwUser").value = S.me ? S.me.user : "";
  ["#pwOld", "#pwNew", "#pwNew2"].forEach(s => $(s).value = "");
  $("#pwMsg").textContent = "";
  $("#pwOld").focus();
}
// Leaving the app view (signed out, password change forced): stop everything that talks to the device.
function leaveApp(msg){
  clearTimeout(pollTimer);
  if (dlgCancel) dlgCancel();
  closeMenu(); busyOff();
  S.ups.filter(u => u.state === "queued").forEach(u => endUp(u, "err", msg));
}
function lost(){
  if (S.auth !== "ok") return;
  const why = S.restart && S.restart !== "download" ? "restart" : "expired";
  S.auth = "login"; S.restart = ""; S.sawDown = false;
  leaveApp(t("upOut"));
  showLogin(why);
}
async function recheck(){              // the role may have changed: ask the device who we are
  if (rechecking || S.auth !== "ok") return;
  rechecking = true;
  const j = await api("/api/session");
  rechecking = false;
  if (j.ok && S.auth === "ok") { setMe(j); listSig = ""; render(); if (inSettings()) loadAdmin(); }
}
const loginMsg = m => { $("#loginMsg").textContent = m; };
function lockTick(){
  clearTimeout(lockTimer);
  const s = Math.ceil((S.lockUntil - Date.now()) / 1000);
  $("#loginBtn").disabled = s > 0;
  loginMsg(s > 0 ? t("locked", s) : "");
  if (s > 0) lockTimer = setTimeout(lockTick, 1000);
}
$("#loginForm").onsubmit = async e => {
  e.preventDefault();
  if (S.lockUntil > Date.now()) return;
  const user = $("#lUser").value.trim(), pass = $("#lPass").value, btn = $("#loginBtn");
  if (!user || !pass) return loginMsg(t("loginEmpty"));
  btn.disabled = true; loginMsg("");
  const body = {user, pass};
  if ($("#lTrust").checked) Object.assign(body, {remember: 1, device: devLabel()});
  const j = await post("/api/login", {auth: true, body: form(body)});
  btn.disabled = false;
  if (j.ok) { $("#lPass").value = ""; return signedIn(j); }
  if (j.code === "LOCKED") { S.lockUntil = Date.now() + (j.retry || 30) * 1000; return lockTick(); }
  if (j.code === "AUTH_UNAVAILABLE") { S.why = "unavail"; renderWhy(); clearTimeout(bootTimer); bootTimer = setTimeout(boot, 5000); return; }   // the notice explains it
  loginMsg(errText(j, "login"));
  if (j.code === "BAD_LOGIN") { $("#lPass").select(); $("#lPass").focus(); }
};
$$("[data-lang]").forEach(b => b.onclick = () => { pref.set("lang", lang === "de" ? "en" : "de"); setLang(pref.get("lang")); renderWhy(); });

// Short name of this browser for the list of trusted devices (at most 32 bytes).
function devLabel(){
  const u = navigator.userAgent;
  const os = /iPhone/.test(u) ? "iPhone" : /iPad/.test(u) || (/Macintosh/.test(u) && navigator.maxTouchPoints > 1) ? "iPad"
    : /Android/.test(u) ? t(/Mobile/.test(u) ? "dPhone" : "dTab") : /Windows/.test(u) ? t("dWin") : /CrOS/.test(u) ? "Chromebook"
    : /Mac/.test(u) ? "Mac" : /Linux/.test(u) ? t("dLinux") : "Browser";
  const br = /Edg/.test(u) ? "Edge" : /Firefox|FxiOS/.test(u) ? "Firefox" : /OPR\//.test(u) ? "Opera" : /Chrome|CriOS/.test(u) ? "Chrome" : /Safari/.test(u) ? "Safari" : "";
  let l = br ? os + " · " + br : os;
  while (bytes(l) > 32) l = l.slice(0, -1);
  return l;
}
function pwErr(a, b, old){
  const n = bytes(a);
  if (n < 5 || n > 64) return t("pwLen");
  if (a === "admin") return t("pwAdmin");
  if (old !== undefined && a === old) return t("pwSame");
  return a === b ? "" : t("pwDiff");
}
async function savePw(old, a, b){
  const err = !old ? t("pwNoOld") : pwErr(a, b, old);
  if (err) return err;
  const r = await post("/api/users/password", {auth: S.auth !== "ok", body: form({user: S.me.user, pass: a, old})});
  if (r.ok) return "";
  if (S.auth === "pw" && r.code === "UNAUTHORIZED") { showLogin("expired"); return ""; }
  return errText(r, "pw");
}
$("#pwForm").onsubmit = async e => {

  await post("/api/logout", {auth: true});

$("#pwOut").onclick = logout;

    fields: [{label: t("pwOld"), type: "password", auto: "current-password"}, {label: t("pwNew"), type: "password", auto: "new-password"}, {label: t("pwNew2"), type: "password", auto: "new-password"}],
    run: ([o, a, b]) => savePw(o, a, b)});

$("#userBtn").onclick = () => showMenu($("#userBtn"), null, `${esc(S.me.user)}<small>${esc(roleName(S.me.role))}</small>`,
  [["pw", "key", t("changePw")], ["out", "logout", t("signOut")]], a => a === "pw" ? changeOwnPw() : logout(), null, true);

/* ---------- Status polling and loading the current folder ---------- */
let pollTimer = 0;
function schedule(ms){ clearTimeout(pollTimer); if (S.auth === "ok") pollTimer = setTimeout(poll, ms); }
async function poll(){

/* Files as plain links; folders as one ZIP each (GET /api/zip), loaded in a hidden frame: a refusal (JSON) lands in the frame
   and is explained, a ZIP becomes a download. Several items go one after another. */
function download(items){
  items = items.filter(Boolean);
  if (!items.length || blocked()) return;
  const dir = S.dir;
  items.forEach((i, n) => setTimeout(() => {
    const p = enc(join(dir, i.name));
    if (i.type !== "dir") {
      const a = document.createElement("a");
      a.href = "/api/download?path=" + p; a.download = i.name;
      document.body.appendChild(a); a.click(); a.remove();
      return;
    }
    const f = document.createElement("iframe");
    f.hidden = true; f.src = "/api/zip?path=" + p;
    f.onload = () => {
      let j = null; try { j = JSON.parse(f.contentDocument.body.textContent); } catch(e) {}
      f.remove();
      if (j && !j.ok) { authFail(j); if (S.auth === "ok") errBox(t("zipDl"), j.code === "WRONG_OWNER" ? t("zipNo") : errText(j, "zip")); }
    };
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 120000);   // a started download fires no onload: do not pile up frames
  }, n * 1500));
}
const BAD_CHARS = /[\/\\:*?"<>|\x00-\x1f]/;
function nameErr(v, dir){
  if (!v) return t("nameEmpty");
  if (BAD_CHARS.test(v) || /^[. ]|[. ]$/.test(v)) return t("nameChars");
  if (bytes(v) > 120) return t("nameLong");
  const p = join(dir, v);
  return bytes(p) > 240 || p.split("/").length > 8 ? t("pathLong") : "";
}
async function rename(name){

const delPath = (dir, i) => `/api/delete?path=${enc(join(dir, i.name))}${i.type === "dir" ? "&recursive=1" : ""}`;
async function del(names){
  if (blocked()) return;
  const dir = S.dir, items = names.map(n => entry(n)).filter(Boolean);
  if (!items.length) return;
  if (items.length === 1) {
    const i = items[0], isDir = i.type === "dir";
    const ok = await ask({title: isDir ? t("delDirT", i.name) : t("delFileT"), text: isDir ? t("delDirX") : t("delFileX", i.name), yes: t("delete"), danger: true,
      run: async () => {
        S.busy = "del";
        try { const r = await post(delPath(dir, i), {timeout: 180000}); return r.ok ? "" : errText(r); }
        finally { S.busy = ""; }
      }});
    if (ok) { S.sel.delete(i.name); await refresh(true); toast(t("deleted")); }
    return;
  }
  const dirs = items.filter(i => i.type === "dir").length;
  if (!await ask({title: t("delManyT", items.length), text: t("delManyX", dirs), yes: t("delete"), danger: true})) return;
  let done = 0, err = "";
  S.busy = "del";
  try {
    for (const [n, i] of items.entries()) {

      const r = await post(delPath(dir, i), {timeout: 180000});

      else { err = `${i.name}: ${errText(r)}`; if (r.code !== "NOT_FOUND") break; }
    }
  } finally { S.busy = ""; busyOff(); }

/* ---------- clipboard: cut / copy, then paste in another folder ---------- */
function clipSet(op, names){
  if (blocked()) return;
  const items = names.map(n => entry(n)).filter(Boolean).map(e => ({name: e.name, type: e.type}));
  if (!items.length) return;
  S.clip = {op, dir: S.dir, items};
  S.sel.clear(); S.selMode = false;
  renderList();
  $("#clipPaste").focus();
}
function freeName(name, taken, isDir){
  const dot = name.lastIndexOf("."), split = !isDir && dot > 0;
  const stem = split ? name.slice(0, dot) : name, ext = split ? name.slice(dot) : "";
  for (let n = 2; ; n++) { const c = `${stem} (${n})${ext}`; if (!taken.has(c.toLowerCase())) return c; }
}
const FATAL = ["NO_SPACE", "OFFLINE", "WRONG_OWNER", "BUSY", "IO", "UNAUTHORIZED", "MUST_CHANGE_PASSWORD", "FORBIDDEN_ROLE", "HTTP", "DRIVE_LOCKED", "CRYPT_DAMAGED"];
async function paste(){
  const c = S.clip; if (!c || blocked()) return;
  const dest = S.dir, copy = c.op === "copy";
  if (!copy && c.dir === dest) return toast(t("alreadyHere"));
  const taken = new Set((S.entries || []).map(e => e.name.toLowerCase()));
  let done = 0, skipped = 0, all = null, stop = false;
  const errs = [], left = [];
  S.busy = c.op;
  try {
    for (let i = 0; i < c.items.length && !stop; i++) {
      const it = c.items[i], from = join(c.dir, it.name);
      if (it.type === "dir" && (dest === from || dest.startsWith(from + "/"))) { errs.push(t("intoSelf", it.name)); left.push(it); continue; }
      let name = it.name;
      for (let tries = 0; ; tries++) {
        const to = join(dest, name);
        if (bytes(to) > 240 || to.split("/").length > 8) { errs.push(`${it.name}: ${t("pathLong")}`); left.push(it); break; }
        if (copy) busyOn(t("copying", name, i + 1, c.items.length), t("copyingX"));
        const r = await post(`/api/${copy ? "copy" : "move"}?from=${enc(from)}&to=${enc(to)}`, {timeout: copy ? 3600000 : 60000});
        busyOff();
        if (r.ok) { done++; taken.add(name.toLowerCase()); break; }
        if (r.code === "EXISTS" && tries < 50) {
          taken.add(name.toLowerCase());
          let choice = all;
          if (!choice) {
            const o = {title: t("existsT", name), yes: t("newNameBtn"), no: t("skip"),
              fields: c.items.length - i > 1 ? [{type: "check", label: t("forAll")}] : []};
            const res = await ask(o);
            if (S.auth !== "ok") { stop = true; break; }
            choice = res ? "rename" : "skip";
            if (o.out && o.out[0]) all = choice;
          }
          if (choice === "skip") { skipped++; left.push(it); break; }
          name = freeName(it.name, taken, it.type === "dir");
          continue;
        }
        errs.push(`${it.name}: ${errText(r, "paste")}`); left.push(it);
        if (FATAL.includes(r.code)) stop = true;
        break;
      }
    }
  } finally { S.busy = ""; busyOff(); }
  if (S.auth !== "ok") return;
  if (!copy) S.clip = left.length && done === 0 ? c : null;   // moved items are gone from the source
  await refresh(true);
  const msg = (done ? t(copy ? "copiedN" : "movedN", done) : "") + (skipped ? (done ? " " : "") + t("skippedN", skipped) : "");
  if (msg) toast(msg);
  if (errs.length) toast(errs.slice(0, 3).join(" "), true);
}

/* ---------- Uploads into the current folder ---------- */
function pick(){ $("#picker").click(); }
// One upload button; a small menu when there is more than one way (folder upload, and on phones "new folder").
const phone = () => matchMedia("(max-width:720px)").matches;
const upItems = () => [["file", "upload", t("uploadFiles")]].concat(dirOK ? [["dir", "updir", t("upDir")]] : [], phone() ? [["mk", "newdir", t("newDir")]] : []);
$("#upBtn").onclick = () => {
  const it = upItems();
  if (it.length < 2) return pick();
  showMenu($("#upBtn"), null, esc(t("upload")), it, a => a === "dir" ? $("#dirPicker").click() : a === "mk" ? mkdir() : pick());
};
$("#picker").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
$("#dirPicker").onchange = e => { const l = Array.from(e.target.files); e.target.value = ""; addTree(l.map(f => ({file: f, rel: f.webkitRelativePath || f.name})), []); };

const newUp = (file, name, dir, g, rd) => S.ups.push({id: ++S.upSeq, file, name, dir, size: file.size, state: "queued", pct: 0, msg: t("upQueued"), g, rd});
const dirOf = p => p.slice(0, Math.max(0, p.lastIndexOf("/")));
function addFiles(list){
  const files = Array.from(list || []);
  if (!files.length) return;
  if (S.busy) return toast(t("waitBusy"));
  const r = S.st && S.st.upload && S.st.upload.resumable;   // the same file again: back into the folder of the unfinished upload
  for (const f of files) newUp(f, f.name, r && f.name === base(r.path) && f.size === r.size ? dirOf(r.path) : S.dir);
  renderUploads();
  work();
}
// A folder (picker or drag and drop): its folders are created first (one group), then the files go through the queue.
function addTree(files, dirs){
  if (S.busy) return toast(t("waitBusy"));
  const hid = p => p.split("/").some(s => s.startsWith("."));      // .DS_Store and other hidden system files: not allowed on the drive
  files = files.filter(x => !hid(x.rel));
  const ds = new Set(dirs.filter(d => !hid(d)));
  files.forEach(x => { const p = x.rel.split("/"); for (let i = 1; i < p.length; i++) ds.add(p.slice(0, i).join("/")); });
  if (!ds.size) return addFiles(files.map(x => x.file));
  const g = {name: [...new Set([...ds].map(d => d.split("/")[0]))].join(", "), base: S.dir, dirs: [...ds].sort((a, b) => a.split("/").length - b.split("/").length), made: false, bad: new Map()};
  S.groups.push(g);
  for (const x of files) newUp(x.file, base(x.rel), join(g.base, dirOf(x.rel)), g, dirOf(x.rel));
  renderUploads();
  work();
}
const badDir = (g, d) => { for (const [k, m] of g.bad) if (d === k || d.startsWith(k + "/")) return m; return ""; };
async function makeDirs(g){
  g.made = true;
  for (const d of g.dirs) {
    if (badDir(g, d)) continue;                      // a parent folder failed already
    const p = join(g.base, d), e = nameErr(base(p), dirOf(p)), r = e ? {} : await post("/api/mkdir?path=" + enc(p));
    if (S.auth !== "ok") return;
    if (e || !r.ok && r.code !== "EXISTS") g.bad.set(d, e || errText(r, "mk"));   // an existing folder is fine: the files go into it
  }
}
// Dropped folders: walk them with the entry API (the items are only valid during the drop event).
async function walk(ents){
  const files = [], dirs = [], read = r => new Promise(res => r.readEntries(res, () => res([])));
  const go = async (x, p) => {
    const rel = p ? p + "/" + x.name : x.name;
    if (x.isFile) { const f = await new Promise(res => x.file(res, () => res(null))); if (f) files.push({file: f, rel}); return; }
    dirs.push(rel);
    for (let r = x.createReader(), b; (b = await read(r)).length;) for (const y of b) await go(y, rel);
  };
  for (const x of ents) await go(x, "");
  addTree(files, dirs);
}
const endUp = (u, state, msg) => { u.state = state; u.msg = msg; u.xhr = null; renderUploads(); };

async function work(){
  if (S.working) return;
  S.working = true; render();
  let okCount = 0, tookOver = false;
  const failQueued = msg => { S.groups.forEach(g => g.made = true); S.ups.filter(u => u.state === "queued").forEach(u => endUp(u, "err", msg)); };
  try {
    if (!await refresh()) failQueued(t(S.auth === "ok" ? "upNoConn" : "upOut"));
    else if (broken(S.st.drive)) failQueued(isLocked() ? errText({code: isDamaged() ? "CRYPT_DAMAGED" : "DRIVE_LOCKED"}) : t("upBroken"));
    else {
      if (S.st.drive.owner === "usb") {
        if (await activate()) tookOver = true;
        else failQueued(t(S.auth === "ok" ? "upNoApp" : "upOut"));
      }
      let u, g;
      while (S.auth === "ok") {
        if ((g = S.groups.find(x => !x.made))) { await makeDirs(g); continue; }
        if (!(u = S.ups.find(x => x.state === "queued"))) break;
        await uploadOne(u); if (u.state === "done") okCount++;
      }
    }
  } finally { S.working = false; }
  if (S.auth !== "ok") { failQueued(t("upOut")); return; }
  await refresh(true);
  if (okCount) {
    const what = t("savedN", okCount);
    // Handing the drive back would discard an upload that can still be resumed.
    if (tookOver && pref.get("auto", "1") === "1" && !S.ups.some(u => u.resume && u.state === "err")) toast(await provide(true) ? what + " " + t("reprovided") : what);
    else toast(what);
  }
  for (const g of S.groups.filter(x => !x.told)) {    // folder uploads: one summary each
    const its = S.ups.filter(u => u.g === g), f = its.filter(u => u.state === "err").length;
    g.told = true;
    if (f) toast(t("dirFail", g.name, f, its.length), true); else if (g.bad.size) toast(g.bad.values().next().value, true); else if (!its.length) toast(t("dirMade", g.name));
  }
  render();
  // A finished queue without problems needs no attention: close the panel after a moment.
  setTimeout(() => { if (!S.working && S.ups.length && !S.ups.some(u => u.state === "err")) clearUps(); }, 6000);
}
function clearUps(){ S.ups = []; S.groups = []; renderUploads(); }

// POST a raw body with progress; resolves the parsed answer, {code:"OFFLINE"} or {code:"ABORT"}.
function xpost(url, body, onprog, keep){
  return new Promise(resolve => {
    const x = new XMLHttpRequest();
    if (keep) keep(x);
    x.open("POST", url);
    x.setRequestHeader("X-PrintDrive", "1");
    x.setRequestHeader("Content-Type", "application/octet-stream");
    x.upload.onprogress = e => { if (e.lengthComputable) onprog(e.loaded, e.total); };

$("#otaPick").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if (f) ota(f); };
async function ota(f){
  const msg = $("#otaMsg"), prog = $("#otaProg"), fail = m => { msg.textContent = m; };
  fail("");
  // Cheap checks before sending 1–2 MB over Wi-Fi: an ESP32 image starts with the magic byte 0xE9.
  if (!/\.bin$/i.test(f.name)) return fail(t("otaNotBin"));
  if (f.size < OTA_MIN) return fail(t("otaSmall"));
  if (f.size > OTA_MAX) return fail(t("otaBig"));
  const head = new Uint8Array(await f.slice(0, 1).arrayBuffer());
  if (head[0] !== 0xE9) return fail(t("otaBad"));
  const ok = await ask({title: t("otaConfT"), text: t("otaConfX", f.name, fsize(f.size)), yes: t("otaGo")});
  if (!ok || blocked()) return;
  S.busy = "ota"; $("#otaBtn").disabled = true;
  $("#otaName").textContent = f.name; $("#otaPct").textContent = "0 %"; $("#otaBar").style.width = "0"; prog.hidden = false;
  const r = await xpost("/api/ota", f, (loaded, total) => {
    const p = Math.floor(loaded / total * 100);
    $("#otaPct").textContent = loaded >= total ? t("otaChecking") : t("otaSending", p);
    $("#otaBar").style.width = p + "%";
  });
  S.busy = ""; $("#otaBtn").disabled = false; prog.hidden = true;
  if (r.ok) return awaitRestart("update");
  authFail(r);
  if (S.auth === "ok") fail(r.code === "INVALID_FILE" ? t("otaBad") : r.code === "TOO_LARGE" ? t("otaBig") : errText(r, "ota"));
}

/* ---------- Routing: "#/Ordner/Unterordner" = folder, "#einstellungen" = settings, "#s-…" jumps to a settings section. ---------- */
function route(){
  if (showHelp(location.hash) || S.auth !== "ok") return;
  const h = location.hash, sec = h.startsWith("#s-") ? document.getElementById(h.slice(1)) : null;
  const settings = h === "#einstellungen" || !!sec, was = inSettings();
  if (sec) history.replaceState(null, "", "#einstellungen");
  $("#vFiles").hidden = settings; $("#vSettings").hidden = !settings;
  $("#navSettings").hidden = settings;
  closeMenu();
  if (!settings) {
    const dir = parseDir(h);
    if (dir !== S.dir) {
      S.dir = dir; S.entries = null; S.sel.clear(); S.selMode = false;
      S.q = ""; $("#search").value = "";
      schedule(0);
    }
  } else {
    $("#backLink").href = dirHash(S.dir);
    if (!was) loadAdmin();
  }
  if (settings && !was) openSec(null);           // settings start with every card closed
  render();
  if (sec) { openSec(sec.closest(".sec")); setTimeout(() => sec.scrollIntoView({behavior: "smooth"})); }
  else if (settings !== was || !settings) scrollTo(0, 0);
  S.prevHash = location.hash || "#/";
}
addEventListener("hashchange", route);
// Settings cards: one open at a time; the tapped header stays where it is on the screen.
function openSec(sec){
  $$(".sec").forEach(x => { const o = x === sec; x.querySelector(".sechead").setAttribute("aria-expanded", String(o)); x.querySelector(".secbody").hidden = !o; });
}
$("#vSettings").addEventListener("click", e => {
  const h = e.target.closest(".sechead"); if (!h) return;
  const y = h.getBoundingClientRect().top;
  openSec(h.getAttribute("aria-expanded") === "true" ? null : h.closest(".sec"));
  scrollBy(0, h.getBoundingClientRect().top - y);
});
// Help page "#!hilfe/<topic>": works signed out too (static texts); folder hashes always start with "#/".
const helpOn = () => document.body.classList.contains("helpv");
function showHelp(h){
  const on = h.startsWith("#!hilfe");
  if (on && !helpOn()) $("#helpBack").href = S.auth === "ok" ? S.prevHash || "#/" : "#";
  if (!on && helpOn()) { document.body.classList.add("fromhelp"); setTimeout(() => document.body.classList.remove("fromhelp"), 400); }   // back the way it came
  document.body.classList.toggle("helpv", on); $("#vHelp").hidden = !on;
  if (!on) return false;
  popClose(); closeMenu();
  const box = $("#helpDoc");
  if (box.dataset.l !== lang) {
    const H = t("helpDoc"); box.dataset.l = lang;
    $("#helpToc").innerHTML = H.map(([k, n]) => `<a href="#!hilfe/${k}">${esc(n)}</a>`).join("");
    box.innerHTML = H.map(([k, n, x]) => `<section class="hsec box" id="hilfe-${k}"><h2>${esc(n)}</h2>${x}</section>`).join("");
  }
  const el = document.getElementById("hilfe-" + h.slice(8));
  if (el) el.scrollIntoView(); else scrollTo(0, 0);
  return true;
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) schedule(0); });

setLang(pref.get("lang", "") || (/^de/i.test(navigator.language || "") ? "de" : "en"));
showHelp(location.hash);
boot();
</script>
